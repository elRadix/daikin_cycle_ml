[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daikin_cycle_ml"
version = "1.17.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".git", "__pycache__", "docs", "brand"]
# fix = false: CI must CHECK, not auto-fix. Use `ruff check --fix` manually.
fix = false

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RET", "PIE", "C4", "RUF"]
ignore = [
    "E501",   # long lines OK in f-strings/logs
    "B008",   # function call in default arg (HA-patroon)
    "RUF012", # mutable class attrs (bewust, HA-idiom)
    # v1.17.0: niet-CI-blokkerende style regels.
    "B905", "B007", "SIM108", "SIM102", "SIM105", "SIM115", "SIM118",
    "UP031", "RUF002", "RUF003", "RUF006", "RUF015", "RUF046", "RUF059",
    "RET504", "PIE810", "C408",
]

[tool.ruff.lint.isort]
known-first-party = ["homeassistant", "custom_components"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",   # assert False (tests)
    "F841",   # unused var in tests
    "E402",   # imports na code (test-setup)
    "SIM117", # nested with (test-fixtures)
    "SIM105", # try-except-pass -- defensief in tests
    "SIM222", # assert x or True -- test-stubs
    "RUF012", # mutable class attrs in test-stubs
]

[tool.pytest.ini_options]
markers = [
    "expected_lingering_tasks: mark test that expects lingering tasks (phcc)",
    "expected_lingering_timers: mark test that expects lingering timers (phcc)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=custom_components.daikin_cycle_ml --cov-fail-under=100"

[tool.coverage.run]
branch = true
source = ["custom_components/daikin_cycle_ml"]
[tool.coverage.report]
fail_under = 100

[tool.mypy]
strict = true
follow_imports = "silent"
ignore_missing_imports = true
