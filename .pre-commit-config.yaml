# .pre-commit-config.yaml
# Local git-hook gates — LOW-02 from the v1.7.1 security audit.
#
# Install once : pip install pre-commit && pre-commit install
# Run all      : pre-commit run --all-files
# Skip once    : git commit --no-verify  (NOT recommended)
#
# These hooks are ADVISORY (local). CI remains authoritative:
#   .github/workflows/{ruff,mypy,pylint,coverage,hacs,hassfest}.yml

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2000"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args:
          - "--no-fix"
          - "--select=E,F,W"
          - "--ignore=E501,E402,F401"
          - "--exclude=tests"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
