name: Model compat

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/MODEL_ATTRIBUTES.json'
      - 'tools/parse_espaltherma_defs.py'
      - 'custom_components/daikin_cycle_ml/engine/attribute_compat.py'
      - 'custom_components/daikin_cycle_ml/const.py'
      - 'custom_components/daikin_cycle_ml/engine/model_profiles.py'
      - 'custom_components/daikin_cycle_ml/data/datasheets.json'
      - '.github/workflows/model-compat.yml'
  schedule:
    - cron: "0 6 * * *"  # Daily at 06:00 UTC
  workflow_dispatch:

jobs:
  pr-gate:
    if: github.event_name == 'pull_request'
    name: Regen + assert
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read pinned branch and SHA
        id: pinned
        run: |
          python - <<'PY'
          import json, os
          meta = json.load(open("docs/MODEL_ATTRIBUTES.json"))["_meta"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"branch={meta['branch']}\n")
              f.write(f"sha={meta['commit']}\n")
          PY

      - name: Clone ESPAltherma at pinned SHA
        run: |
          git init /tmp/espaltherma
          cd /tmp/espaltherma
          git remote add origin https://github.com/raomin/ESPAltherma
          git fetch --depth 1 origin "${{ steps.pinned.outputs.sha }}"
          git checkout FETCH_HEAD

      - name: Assert pinned SHA is checked out
        run: |
          ACTUAL=$(git -C /tmp/espaltherma rev-parse HEAD)
          EXPECTED="${{ steps.pinned.outputs.sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Pinned SHA not reachable: expected=$EXPECTED got=$ACTUAL"
            exit 1
          fi

      - name: Re-parse into /tmp/regen.json
        run: |
          python tools/parse_espaltherma_defs.py \
            --source /tmp/espaltherma \
            --branch "${{ steps.pinned.outputs.branch }}" \
            --out /tmp/regen.json

      - name: Assert compatibility contract
        run: |
          python tools/check_compat_contract.py \
            --tracked docs/MODEL_ATTRIBUTES.json \
            --regen /tmp/regen.json \
            --compat custom_components/daikin_cycle_ml/engine/attribute_compat.py

      - name: Assert model surface contract
        run: |
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "_const",
              "custom_components/daikin_cycle_ml/const.py",
          )
          if spec is None or spec.loader is None:
              raise SystemExit("error: cannot load const.py")
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          mc, ml = set(m.MODEL_CHOICES), set(m.MODEL_LABELS)
          drift = mc ^ ml
          if drift:
              print(f"::error::drift: {sorted(drift)}")
              raise SystemExit(1)
          print(f"OK: {len(mc)} choices == {len(ml)} labels")
          PY

      # #413: ESPAltherma v2 names (MQTT keys / HA ids) come from
      # data/catalog_names.txt; the snapshot must match its pinned commit.
      - name: v2 catalog snapshot matches its pin
        run: |
          SHA=$(python -c "import json; print(json.load(open('docs/ESPALTHERMA_V2_CATALOG.json'))['_meta']['commit'])")
          git init -q /tmp/esp-v2
          git -C /tmp/esp-v2 remote add origin https://github.com/raomin/ESPAltherma
          git -C /tmp/esp-v2 fetch -q --depth 1 origin "$SHA"
          git -C /tmp/esp-v2 checkout -q FETCH_HEAD
          python tools/parse_espaltherma_catalog.py --source /tmp/esp-v2 \
            --branch beta --out /tmp/v2-catalog.json
          diff -u docs/ESPALTHERMA_V2_CATALOG.json /tmp/v2-catalog.json

  weekly-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Weekly upstream drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read pinned branch and SHA
        id: pinned
        run: |
          python - <<'PY'
          import json, os
          meta = json.load(open("docs/MODEL_ATTRIBUTES.json"))["_meta"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"branch={meta['branch']}\n")
              f.write(f"sha={meta['commit']}\n")
          PY

      - name: Get upstream SHA
        id: upstream
        run: |
          SHA=$(git ls-remote "https://github.com/raomin/ESPAltherma" \
            "refs/heads/${{ steps.pinned.outputs.branch }}" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Compare SHAs
        id: cmp
        run: |
          if [ "${{ steps.pinned.outputs.sha }}" = "${{ steps.upstream.outputs.sha }}" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "OK: pinned == upstream"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "DRIFT: pinned=${{ steps.pinned.outputs.sha }} upstream=${{ steps.upstream.outputs.sha }}"
          fi

      # #413: list the v2 names that disappear upstream (renames show as
      # removed + added), flagging the ones the integration reads.
      - name: v2 catalog diff
        if: steps.cmp.outputs.drift == 'true'
        run: |
          git clone -q --depth 1 --branch "${{ steps.pinned.outputs.branch }}" \
            https://github.com/raomin/ESPAltherma /tmp/esp-up
          if python tools/parse_espaltherma_catalog.py --source /tmp/esp-up \
              --branch "${{ steps.pinned.outputs.branch }}" --out /tmp/up-catalog.json; then
            python tools/parse_espaltherma_catalog.py --diff \
              docs/ESPALTHERMA_V2_CATALOG.json /tmp/up-catalog.json > /tmp/catalog-diff.md
          else
            echo "v2 catalog could not be read upstream." > /tmp/catalog-diff.md
          fi
          cat /tmp/catalog-diff.md

      - name: Open or update tracking issue
        if: steps.cmp.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="ESPAltherma \`refs/heads/${{ steps.pinned.outputs.branch }}\` moved.

          - Pinned: \`${{ steps.pinned.outputs.sha }}\`
          - Upstream: \`${{ steps.upstream.outputs.sha }}\`
          - Compare: https://github.com/raomin/ESPAltherma/compare/${{ steps.pinned.outputs.sha }}...${{ steps.upstream.outputs.sha }}

          ## Regenerate

          \`\`\`
          git clone --depth 1 --branch ${{ steps.pinned.outputs.branch }} \\
            https://github.com/raomin/ESPAltherma /tmp/espaltherma
          python3 tools/parse_espaltherma_defs.py \\
            --source /tmp/espaltherma \\
            --branch ${{ steps.pinned.outputs.branch }} \\
            --out docs/MODEL_ATTRIBUTES.json
          pytest tests/test_model_compat.py -q --no-cov
          \`\`\`

          See docs/MODEL_COMPATIBILITY.md section 9 for full workflow.

          ## v2 catalog (ESPAltherma v2 entity names, #413)

          $(cat /tmp/catalog-diff.md)

          Regenerate the snapshot (v1 keeps MODEL_ATTRIBUTES.json):

          \`\`\`
          python3 tools/parse_espaltherma_catalog.py --source /tmp/espaltherma \\
            --branch ${{ steps.pinned.outputs.branch }} --out docs/ESPALTHERMA_V2_CATALOG.json
          pytest tests/test_413_v2_catalog.py -q --no-cov
          \`\`\`

          This issue is managed by .github/workflows/model-compat.yml (weekly-drift). It is edited, not duplicated."

          # #392: the label did not exist, so `gh issue create --label`
          # failed and the drift job went red daily. Create it idempotently.
          gh label create "model-compat" \
            --description "ESPAltherma upstream drift (model-compat workflow)" \
            --color "5319e7" --force

          EXISTING=$(gh issue list --label "model-compat" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body "$BODY"
          else
            echo "Creating new tracking issue"
            gh issue create \
              --title "ESPAltherma upstream moved (beta)" \
              --label "model-compat" \
              --body "$BODY"
          fi
