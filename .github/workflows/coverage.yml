name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          pip install pytest-homeassistant-custom-component
          pip install homeassistant aiosqlite
      - name: Setup custom_components symlink
        run: |
          mkdir -p custom_components
          ln -sfn "$(pwd)" custom_components/daikin_cycle_ml
          ls -la custom_components/
      - name: Run pytest with coverage gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q --no-header \
            --cov=custom_components.daikin_cycle_ml \
            --cov-fail-under=95 \
            --cov-report=term-missing
