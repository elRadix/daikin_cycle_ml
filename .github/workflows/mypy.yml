name: Mypy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install mypy + Home Assistant
        run: |
          python -m pip install --upgrade pip
          pip install mypy "homeassistant==2026.9.3"
      - name: Mypy strict (integration code)
        run: |
          python -m mypy --strict --python-version 3.14 \
            --follow-imports=silent --ignore-missing-imports \
            __init__.py const.py coordinator.py config_flow.py \
            sensor.py binary_sensor.py diagnostics.py repairs.py \
            services.py entity.py engine/ ml/ storage/
