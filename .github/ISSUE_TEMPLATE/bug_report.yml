name: Bug Report
description: Report a bug or unexpected behavior in Daikin Cycle ML
title: "[Bug]: "
labels: ["bug"]
assignees: [elRadix]
body:
  - type: markdown
    attributes:
      value: |
        ## 📎 Attach your diagnostics file
        The **single most useful thing** for us: a diagnostics JSON file.
        Step-by-step at the bottom of this form.

        Before you submit:
        - Search [existing issues](https://github.com/elRadix/daikin_cycle_ml/issues)
        - Update to the [latest version](https://github.com/elRadix/daikin_cycle_ml/releases/latest) via HACS

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checklist
      options:
        - label: I searched existing issues and discussions
          required: true
        - label: I am running the latest version via HACS
          required: true
        - label: I will attach a diagnostics file (or a SQL extract below)
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where you see the problem (pick the closest).
      options:
        - "Cycle detection (runs, hot water, defrost, backup heater)"
        - "COP, energy, SPF"
        - "Alerts and notifications"
        - "Native card: Daily summary"
        - "Native card: Efficiency"
        - "Native card: Performance / model profile"
        - "YAML dashboard card"
        - "Heating-curve advice"
        - "Setup, options, model choice"
        - "Something else"
    validations:
      required: true

  - type: textarea
    id: what_happens
    attributes:
      label: What happens
      description: What you see, on which card or sensor, and since when.
      placeholder: |
        Example: the Daily summary card shows no hot-water runs since 20 November,
        although the tank heats up every morning around 06:00.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      placeholder: "Example: one hot-water run every morning."
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: When did it last happen?
      description: Date and time of one example, so it can be found in the diagnostics and history.
      placeholder: "2026-11-22 06:15"

  - type: dropdown
    id: integration_version
    attributes:
      label: Daikin Cycle ML version
      description: >
        Settings -> Devices & Services -> Daikin Cycle ML (the version is
        shown on the entry), or HACS -> Daikin Cycle ML. The list is
        updated with every release.
      options:
        # VERSIONS:BEGIN (tools/sync_issue_template.py)
        - "1.30.0 (latest)"
        - "1.29.1"
        - "1.29.0"
        - "1.28.1"
        - "1.28.0"
        - "1.27.1"
        - "Older (type the exact version under Anything else)"
        # VERSIONS:END
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Core version
      description: Settings -> About
      placeholder: "e.g. 2026.11.2"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Heat pump model
      description: Entry title in Settings -> Devices & Services, e.g. epra12eav3
      placeholder: "epra12eav3"
    validations:
      required: true

  - type: input
    id: espaltherma_version
    attributes:
      label: ESPAltherma version
      description: Optional. The firmware on your ESP (for example a release tag, or "beta" with its date).
      placeholder: "e.g. v2.x / beta 2026-11"

  - type: dropdown
    id: source_type
    attributes:
      label: Source type
      options:
        - "Monolithic entity (sensor.althermasensors)"
        - "Individual entities (ESPAltherma v2, sensor.espaltherma_*)"
        - "Auto-detect"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: >
        Optional. Lines from Settings -> System -> Logs that mention
        daikin_cycle_ml. For more detail, add this to configuration.yaml
        and restart:
        logger: / default: warning / logs: / custom_components.daikin_cycle_ml: debug
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Screenshots of the card or of the Home Assistant history help a lot
        (for example the attributes of the ESPAltherma sensor during the
        moment it went wrong), or a SQL extract.

  - type: markdown
    attributes:
      value: |
        ---
        ## 📎 How to download the diagnostics file

        1. Settings -> Devices & Services -> Daikin Cycle ML
        2. Click the **three dots** (⋮) next to the integration
        3. Select **Download diagnostics**
        4. Drag the downloaded `.json` file into the comment box below

        If the file is >10 MB: open it in a text editor, remove the
        `database.extra.daily_summary` block, then attach the trimmed file.

        **Privacy:** passwords, tokens, the notify service and your
        location are removed before download. The file still contains your
        entity names and the ESPAltherma values: read it first if that
        matters to you. Shared files may be kept, anonymised, as test data.
