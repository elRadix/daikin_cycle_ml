              }
              s += dotsParts;
              s += '<line x1="'+cPadL+'" y1="'+(cY+cPadT+cPlotH)+'" x2="'+(cPadL+cPlotW)+'" y2="'+(cY+cPadT+cPlotH)+'" stroke="'+TH.text+'" stroke-width="0.6" opacity="0.4"/>';
              
              var labelStep = Math.max(1, Math.ceil(sub.length/7));
              for (var i3=0; i3<sub.length; i3+=labelStep){
                s += T(slotCx(i3).toFixed(1), cY+cPadT+cPlotH+10, weekday(sub[i3].day), {a:'middle', s:6.5, w:800, f:TH.sub});
              }
              
              var legY = cY+cH-2;
