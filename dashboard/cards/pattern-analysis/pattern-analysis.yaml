              }
              
              if (copMin !== null && copMax !== null && copMax > copMin) {
                var bandX = P+108, bandY = 60, bandW = 100, bandH = 4;
                var bandPos = bandX + ((copToday - copMin)/(copMax-copMin))*bandW;
                s += '<rect x="'+bandX+'" y="'+bandY+'" width="'+bandW+'" height="'+bandH+'" rx="2" fill="'+TH.grid+'"/>';
