              ];
              var dsPop = popAttr({title:t('cop_vs_ds'), items:dsItems});
              s += '<g '+dsPop+' style="cursor:pointer;">';
              s += '<rect x="'+dsX+'" y="14" width="96" height="50" rx="8" fill="'+(dsVal===null?'rgba(128,128,128,0.08)':(dsVal>=0?'rgba(46,125,50,0.10)':'rgba(198,40,40,0.10)'))+'"/>';
              s += T(dsX+48, 27, t('cop_vs_ds'), {a:'middle', s:7.5, w:900, f:TH.sub});
              s += T(dsX+48, 47, (dsApprox?'~':'')+pct(dsVal), {a:'middle', s:16, w:900, f:(dsVal===null?TH.sub:(dsVal>=0?TH.green:TH.red)), halo:1});
              if (dsApprox && dsRef !== null) {
                s += T(dsX+48, 59, 'ref '+fmt1(dsRef)+' (A7/W35)', {a:'middle', s:6, w:800, f:TH.sub});
              } else if (dsVal !== null) {
                s += T(dsX+48, 59, arrow(dsVal), {a:'middle', s:9, w:900, f:(dsVal>=0?TH.green:TH.red)});
              }
              s += '</g>';

              /* ROW 2: Trend */
              var tY = 72, tH = 80, tPadL = 28, tPadR = 8, tPadT = 4, tPadB = 14;
              var tPlotW = W - tPadL - tPadR, tPlotH = tH - tPadT - tPadB;
              var allVals = [modeData.heating.day, modeData.heating.week, modeData.heating.month,
                             modeData.dhw.day, modeData.dhw.week, modeData.dhw.month,
                             modeData.cooling.day, modeData.cooling.week, modeData.cooling.month].filter(hasN);
              if (allVals.length > 0) {
                var tMin = Math.max(0, Math.min.apply(null, allVals) - 0.3);
                var tMax = Math.max.apply(null, allVals) + 0.3;
                var tRng = Math.max(0.5, tMax - tMin);
                var hX = [tPadL+40, tPadL+tPlotW/2, tPadL+tPlotW-30];
                var hy = function(v){ return tY + tPadT + tPlotH - ((v-tMin)/tRng)*tPlotH; };
                for (var gy=0; gy<=2; gy++) {
                  var gv2 = tMin + (tRng*gy/2);
                  var gyy2 = hy(gv2);
                  s += '<line x1="'+tPadL+'" y1="'+gyy2+'" x2="'+(tPadL+tPlotW)+'" y2="'+gyy2+'" stroke="'+TH.grid+'" stroke-width="0.8"/>';
                  s += T(tPadL-3, gyy2+3, gv2.toFixed(1), {a:'end', s:7, w:800, f:TH.sub});
                }
                ['heating','dhw','cooling'].forEach(function(mk){
                  var md = modeData[mk];
                  var vals = [md.day, md.week, md.month];
                  var valid = [];
                  for (var pi2=0; pi2<3; pi2++) if (hasN(vals[pi2])) valid.push(pi2);
                  if (valid.length === 0) return;
                  if (valid.length >= 2) {
                    var mp = '';
                    for (var pv=0; pv<valid.length; pv++){ var idx=valid[pv]; mp += (pv===0?'M':' L')+hX[idx].toFixed(1)+','+hy(vals[idx]).toFixed(1); }
                    s += '<path d="'+mp+'" fill="none" stroke="'+MODE_COL[mk]+'" stroke-width="2" stroke-linecap="round" opacity="0.9"/>';
                  }
                  for (var pv2=0; pv2<3; pv2++) {
                    if (!hasN(vals[pv2])) continue;
                    var statsi = modeData[mk].stats;
                    var dotItems = [
                      {t:'hl', k:MODE_ICON[mk]+' '+mk, v:fmt1(vals[pv2]), c:MODE_COL[mk]},
                      {t:'sep'},
