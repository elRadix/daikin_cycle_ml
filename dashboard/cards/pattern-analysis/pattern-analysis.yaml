            /* SCATTER */
            var buildScatterContent = function(sub, wkey){
              var scW=460, scH=350, scPadL=58, scPadR=16, scPadT=26, scPadB=54;
              var scPlotW = scW-scPadL-scPadR, scPlotH = scH-scPadT-scPadB;
              var scXMax = Math.max(6, Math.max.apply(null, sub.map(function(d){ return d.cycles; })) + 1);
              var scYMaxRaw = Math.max.apply(null, sub.map(function(d){ return d.dur_avg; }));
              var scYMax = Math.max(60, Math.ceil(scYMaxRaw/60)*60);
              var scX = function(v){ return scPadL + (v/scXMax)*scPlotW; };
              var scY = function(v){ return scPadT + scPlotH - (v/scYMax)*scPlotH; };
              var xHalf = Math.min(scXMax-0.5, 5);
              var gid = function(n){ return n+'_'+wkey; };
              var subTotalCycles = sub.reduce(function(a,d){ return a+d.cycles; }, 0);
              var pts = [];
              for(var si=0; si<sub.length; si++){
                if(sub[si].cycles === 0) continue;
                pts.push({idx:si, x:scX(sub[si].cycles), y:scY(sub[si].dur_avg),
                  r: 5 + Math.min(4, sub[si].cycles*0.8),
                  d: sub[si],
                  isLatest: si === sub.length-1,
                  isToday: sub[si].day === TODAY_ISO});
              }
              var placedLabels = [];
              var tryPlace = function(x, y, r){
