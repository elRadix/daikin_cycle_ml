              }
              s += '<line x1="'+scPadL+'" y1="'+qyG+'" x2="'+(scPadL+scPlotW)+'" y2="'+qyG+'" stroke="'+TH.green+'" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>';
              s += '<line x1="'+qx+'" y1="'+scPadT+'" x2="'+qx+'" y2="'+(scPadT+scPlotH)+'" stroke="'+TH.green+'" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>';
              for(var pj=0; pj<pts.length; pj++){
                var p = pts[pj], dS = p.d;
                var sc2 = qColor(dS.quality_avg);
                var sharePct = subTotalCycles>0 ? Math.round(dS.cycles/subTotalCycles*100) : 0;
                var items = [
                  {t:'hl', k:t('r_quality'), v:(dS.quality_avg===null?'—':vI(dS.quality_avg)+'%'), c:sc2},
                  {t:'sep'},
