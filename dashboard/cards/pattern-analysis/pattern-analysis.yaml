                }
                s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(p.r+4)+'" fill="'+sc2+'" opacity="0.12"/>';
                s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+p.r+'" fill="'+sc2+'" stroke="'+TH.bg+'" stroke-width="'+(p.isLatest?3:2.2)+'"'+(p.isLatest?' filter="url(#'+gid('ps-glow')+')"':'')+'/>';
                s += '</g>';
