                  var cy = cands[ci];
                  var collides = false;
                  for (var pi=0; pi<placedLabels.length; pi++){
                    if (Math.abs(placedLabels[pi].x - x) < 32 && Math.abs(placedLabels[pi].y - cy) < 11) { collides = true; break; }
                  }
