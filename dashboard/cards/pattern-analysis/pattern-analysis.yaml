                {label:'GOED', sub:'60-180m', col:TH.green, bg:DARK?'rgba(102,187,106,0.10)':'#E8F5E9', n:0, durSum:0, days:{}},
                {label:'LANG', sub:'>180m', col:TH.blue, bg:DARK?'rgba(66,165,245,0.10)':'#E3F2FD', n:0, durSum:0, days:{}}
              ];
              rawDays.forEach(function(rd){
                if(!rd.day || !windowSet[rd.day] || !rd.cycles || rd.cycles <= 0) return;
                var avg = rdDurAvg(rd);
                if(!isFinite(avg) || avg <= 0) return;
                var idx = avg<20?0:avg<60?1:avg<180?2:3;
                dist[idx].n += rd.cycles;
                dist[idx].durSum += rdDurMin(rd);
                dist[idx].days[rd.day] = (dist[idx].days[rd.day]||0) + rd.cycles;
              });
              var totCycles = dist.reduce(function(a,o){ return a+o.n; }, 0);
              var distMax = Math.max(1, dist[0].n, dist[1].n, dist[2].n, dist[3].n);
