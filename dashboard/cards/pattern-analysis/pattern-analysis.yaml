              }

              var dsX = W - P - 96;
              var dsItems = [
                {t:'hl', k:t('cop_vs_ds'), v:(dsApprox?'~':'')+pct(dsVal), c:(dsVal===null?TH.sub:(dsVal>=0?TH.green:TH.red))},
