                  var durLblY = lblY < p.y ? lblY - 12 : lblY + 12;
                  s += T(p.x, durLblY, fmtMin(dS.dur_avg), {a:'middle', s:p.isLatest?8:7, w:800, f:TH.sub, halo:1});
                }
              }
              s += '<line x1="'+scPadL+'" y1="'+(scPadT+scPlotH)+'" x2="'+(scPadL+scPlotW)+'" y2="'+(scPadT+scPlotH)+'" stroke="'+TH.text+'" stroke-width="1.5"/>';
              s += '<line x1="'+scPadL+'" y1="'+scPadT+'" x2="'+scPadL+'" y2="'+(scPadT+scPlotH)+'" stroke="'+TH.text+'" stroke-width="1.5"/>';
              s += T(scPadL+scPlotW/2, scH-8, t('axis_x_cyc'), {a:'middle', s:11, w:900, attr:'letter-spacing="0.5"'});
              s += T(10, scPadT+scPlotH/2, t('axis_y_dur'), {a:'middle', s:11, w:900, attr:'transform="rotate(-90 10 '+(scPadT+scPlotH/2)+')"'});
              return s;
            };

            /* COP */
            var buildCopContent = function(sub, wkey){
              var W = 460, H = 460, P = 12;
              var CW = (W - P*3) / 2;
              var gid = function(n){ return n+'_'+wkey; };
              
              var secTitle = function(y, txt) { return T(P, y, txt, {s:9, w:900, f:TH.sub, attr:'letter-spacing="0.5"'}); };

              var modeData = {};
              ['heating','dhw','cooling'].forEach(function(mk){
                var day = getState(resolveEntity('cop_'+mk+'_day'));
                var week = getState(resolveEntity('cop_'+mk+'_week'));
                var month = getState(resolveEntity('cop_'+mk+'_month'));
                var dayAttr = states[resolveEntity('cop_'+mk+'_day')] ? states[resolveEntity('cop_'+mk+'_day')].attributes : null;
                var stats = (dayAttr && dayAttr.by_mode && dayAttr.by_mode[mk]) ? dayAttr.by_mode[mk] : null;
                modeData[mk] = {day:day, week:week, month:month, stats:stats};
              });
              var copComb = getState(resolveEntity('cop_today'));
              var copTodayAttrs = states[resolveEntity('cop_today')] ? states[resolveEntity('cop_today')].attributes : null;
              var copToday = getState(resolveEntity('cop_today'));
              if (copToday === null && copComb !== null) copToday = copComb;
              var copMin = (copTodayAttrs && hasN(copTodayAttrs.cop_min)) ? parseFloat(copTodayAttrs.cop_min) : null;
              var copMax = (copTodayAttrs && hasN(copTodayAttrs.cop_max)) ? parseFloat(copTodayAttrs.cop_max) : null;
              var copSamples = (copTodayAttrs && hasN(copTodayAttrs.samples_today)) ? parseInt(copTodayAttrs.samples_today) : null;
              var spf = getState(resolveEntity('spf_season'));
              var degr = getState(resolveEntity('cop_degradation_week'));
              var buhRt = getState(resolveEntity('runtime_buh'));
              var defrCnt = getState(resolveEntity('defrost_count'));

              var dsSensor = getState(resolveEntity('cop_vs_datasheet_pct'));
              var hpSpecs = states[HP_SPECS] ? states[HP_SPECS].attributes : null;
              var dsRef = null;
              if (hpSpecs && Array.isArray(hpSpecs.points)) {
                for (var pi=0; pi<hpSpecs.points.length; pi++) {
                  var pt = hpSpecs.points[pi];
                  if (pt && pt.label === 'A7/W35' && hasN(pt.cop)) { dsRef = parseFloat(pt.cop); break; }
                }
              }
              var dsVal = null, dsApprox = false, dsMeasured = null;
              if (dsSensor !== null) {
                dsVal = dsSensor;
                dsMeasured = hasN(modeData.heating.day) ? modeData.heating.day : copToday;
              } else {
                dsMeasured = hasN(modeData.heating.day) ? modeData.heating.day : copToday;
                if (dsRef !== null && hasN(dsMeasured)) {
                  dsVal = ((dsMeasured - dsRef) / dsRef) * 100;
                  dsApprox = true;
                }
              }

              var learnedAttrs = states[resolveEntity('learned_thresholds')] ? states[resolveEntity('learned_thresholds')].attributes : null;
              var targetCycles = (learnedAttrs && hasN(learnedAttrs.target_cycles_per_day)) ? parseFloat(learnedAttrs.target_cycles_per_day) : 6;
              var targetDur = 45;

              var curveAttrs = attr(resolveEntity('cop_curve_recent'), 'points', null);
              var curve = null;
              if (Array.isArray(curveAttrs)) {
                var tmp = [];
                for (var ci=0; ci<curveAttrs.length; ci++) {
                  var cp = curveAttrs[ci];
                  if (!cp || typeof cp !== 'object') continue;
                  var cv = hasN(cp.cop_mean) ? parseFloat(cp.cop_mean) : (hasN(cp.cop_p50) ? parseFloat(cp.cop_p50) : null);
                  if (cv !== null && cv > 0) tmp.push({cop: cv, mode: cp.mode, ts: cp.ts});
                }
                if (tmp.length >= 2) curve = tmp;
              }

              var s = '<defs><linearGradient id="'+gid('copg')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+TH.accent+'" stop-opacity="0.30"/><stop offset="100%" stop-color="'+TH.accent+'" stop-opacity="0"/></linearGradient></defs>';

              s += secTitle(10, 'COP PERFORMANCE');
              s += secTitle(110, 'MODE BREAKDOWN');
              s += secTitle(232, 'DURATION & CYCLES TREND');
              s += secTitle(364, 'SYSTEM HEALTH');

              /* ROW 1: Header */
              var copHeaderItems = [
                {t:'hl', k:'COP', v:fmt1(copToday), c:TH.accent2},
                {t:'sep'}
              ];
              if (copMin !== null) copHeaderItems.push({t:'kv', k:'Min', v:fmt1(copMin), c:TH.red});
              if (copMax !== null) copHeaderItems.push({t:'kv', k:'Max', v:fmt1(copMax), c:TH.green});
              if (copSamples !== null) copHeaderItems.push({t:'kv', k:t('r_samples'), v:String(copSamples), c:TH.sub});
              if (curve) copHeaderItems.push({t:'kv', k:'48h', v:curve.length+'h', c:TH.sub});
              var headerPop = popAttr({title: t('cop_today'), items: copHeaderItems});
              s += '<g '+headerPop+' style="cursor:pointer;">';
              s += T(P, 26, t('cop_today'), {s:9, w:900, f:TH.sub});
              s += T(P, 60, fmt1(copToday), {s:32, w:900, f:TH.accent2, halo:1});
              s += '<rect x="'+P+'" y="14" width="120" height="52" fill="transparent"/>';
              s += '</g>';
              if (copSamples !== null) {
                s += T(P+72, 60, copSamples+'s', {s:8, w:800, f:TH.sub});
              }

              if (curve && curve.length >= 2) {
                var spkX = P+108, spkY = 36, spkW = 100, spkH = 20;
                var spkCops = curve.map(function(c){ return c.cop; });
                var spkMin = Math.min.apply(null, spkCops);
                var spkMax = Math.max.apply(null, spkCops);
                var spkRng = Math.max(0.1, spkMax - spkMin);
                var spkPath = '';
                for (var spi=0; spi<curve.length; spi++){
                  var spx = spkX + (spi/(curve.length-1))*spkW;
                  var spy = spkY + spkH - ((curve[spi].cop - spkMin)/spkRng)*spkH;
                  spkPath += (spi===0?'M':' L') + spx.toFixed(1) + ',' + spy.toFixed(1);
                }
                var curveItems = [
                  {t:'hl', k:t('r_samples'), v:String(curve.length), c:TH.accent},
                  {t:'sep'},
