              });
              s += '<filter id="'+gid('pg-glow')+'" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
              s += '</defs>';
              for(var yi=0; yi<=4; yi++){
