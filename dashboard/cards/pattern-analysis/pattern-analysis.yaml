                ];
                if (dayList.length > 0) { items.push({t:'sep'}); for (var dii=0; dii<dayList.length; dii++){ items.push({t:'kv', k:weekday(dayList[dii])+' '+fmtDay(dayList[dii]), v:o.days[dayList[dii]]+'×', c:o.col}); } }
                var pattr = popAttr({title: o.label+' '+o.sub, items: items, modes: []});
