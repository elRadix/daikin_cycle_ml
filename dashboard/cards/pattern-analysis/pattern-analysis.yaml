                  {t:'kv', k:t('r_maxdur'), v:fmtMin(d.dur_max_min), c:TH.text},
                  {t:'sep'},
                  {t:'kv', k:t('r_quality'), v:(q===null?'—':vI(q)+'%'), c:qColor(q)},
                  {t:'kv', k:t('r_buh'), v:String(d.buh||0), c:d.buh>0?TH.buh:TH.sub},
                  {t:'kv', k:t('r_defrost'), v:String(d.defrost||0), c:d.defrost>0?TH.defrost:TH.sub}
                ];
                var barPop = popAttr({title:weekday(d.day)+' '+fmtDay(d.day), items:barItems, modes:buildModeChips(d)});
                barsParts += '<g '+barPop+' style="cursor:pointer;">';
                if (bh > 0.5) {
                  barsParts += '<rect x="'+(bxc-barW/2).toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="2" fill="'+bcol+'" opacity="'+(isToday2?1:0.85)+'"/>';
                  if (isToday2) {
                    barsParts += '<rect x="'+(bxc-barW/2).toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="2" fill="'+bcol+'"><animate attributeName="opacity" values="1;0.55;1" dur="2.5s" repeatCount="indefinite"/></rect>';
                  }
                }
                if (badge) barsParts += '<text x="'+bxc.toFixed(1)+'" y="'+(by-6).toFixed(1)+'" text-anchor="middle" font-size="10" pointer-events="none">'+badge+'</text>';
                barsParts += '<rect x="'+(bxc-slotW/2).toFixed(1)+'" y="'+(cY+cPadT)+'" width="'+slotW.toFixed(1)+'" height="'+cPlotH+'" fill="transparent" pointer-events="all"/>';
                barsParts += '</g>';
                var ly = cntY(cntVals[i2]);
                linePath += (i2===0?'M':' L') + bxc.toFixed(1) + ',' + ly.toFixed(1);
                dotsParts += '<circle cx="'+bxc.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="'+(isToday2?3.5:2.5)+'" fill="'+TH.purple+'" stroke="'+TH.bg+'" stroke-width="1.5"/>';
                if (isToday2) {
                  dotsParts += '<circle cx="'+bxc.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3.5" fill="'+TH.purple+'"><animate attributeName="r" values="3.5;9;3.5" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/></circle>';
                }
