                    ];
                    if (statsi) {
                      if (hasN(statsi.n_samples)) dotItems.push({t:'kv', k:t('r_samples'), v:String(statsi.n_samples), c:TH.sub});
                      if (hasN(statsi.cop_min) && hasN(statsi.cop_max)) dotItems.push({t:'kv', k:'Range', v:fmt1(statsi.cop_min)+'–'+fmt1(statsi.cop_max), c:TH.text});
                    }
                    var dotPop = popAttr({title:MODE_ICON[mk]+' '+mk, items:dotItems});
