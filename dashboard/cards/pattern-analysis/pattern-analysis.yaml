              s += '<text x="'+(cxComb+6)+'" y="'+(cyComb+14)+'" font-size="10">⚡</text>';
              s += T(cxComb+22, cyComb+13, 'COMB', {s:7, w:900, f:TH.sub});
              s += T(cxComb+6, cyComb+34, fmt1(copComb), {s:16, w:900, f:TH.accent, halo:1});
              s += '</g>';

              /* ROW 4: Combined Chart */
              var cY = 244, cH = 120;
              var cPadL = 22, cPadR = 22, cPadT = 12, cPadB = 14;
              var cPlotW = W - cPadL - cPadR, cPlotH = cH - cPadT - cPadB;
              var durVals = sub.map(function(d){ return d.dur_avg || 0; });
              var cntVals = sub.map(function(d){ return d.cycles || 0; });
              var durMaxActual = Math.max.apply(null, durVals.concat([targetDur*1.2, 60]));
              var durYMax = Math.ceil(durMaxActual / 60) * 60;
              var cntMaxActual = Math.max.apply(null, cntVals.concat([targetCycles*1.5, 4]));
              var cntYMax = Math.ceil(cntMaxActual * 1.2);
              var slotW = cPlotW / sub.length;
              var barW = Math.max(2, Math.min(slotW*0.55, 12));
              var durY = function(v){ return cY + cPadT + cPlotH - (v/durYMax)*cPlotH; };
              var cntY = function(v){ return cY + cPadT + cPlotH - (v/cntYMax)*cPlotH; };
              var slotCx = function(i){ return cPadL + (i+0.5)*slotW; };
              
              var gridParts = '';
              for (var g=0; g<=2; g++){
                var gyc = cY + cPadT + cPlotH - (g/2)*cPlotH;
                var dval = Math.round((g/2)*durYMax);
                var cval = Math.round((g/2)*cntYMax);
                gridParts += '<line x1="'+cPadL+'" y1="'+gyc+'" x2="'+(cPadL+cPlotW)+'" y2="'+gyc+'" stroke="'+TH.grid+'" stroke-width="0.8"/>';
                gridParts += T(cPadL-3, gyc+3, dval, {a:'end', s:6.5, w:800, f:TH.text});
                gridParts += T(cPadL+cPlotW+3, gyc+3, cval, {s:6.5, w:800, f:TH.purple});
              }
              var tgtParts = '';
              if (targetDur > 0 && targetDur <= durYMax) {
                var tdY = durY(targetDur);
                tgtParts += '<line x1="'+cPadL+'" y1="'+tdY+'" x2="'+(cPadL+cPlotW)+'" y2="'+tdY+'" stroke="'+TH.green+'" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>';
              }
              if (targetCycles > 0 && targetCycles <= cntYMax) {
                var tcY = cntY(targetCycles);
                tgtParts += '<line x1="'+cPadL+'" y1="'+tcY+'" x2="'+(cPadL+cPlotW)+'" y2="'+tcY+'" stroke="'+TH.purple+'" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>';
              }
              var barsParts = '', linePath = '', dotsParts = '';
              var latestIdx = sub.length - 1;
              for (var i2=0; i2<sub.length; i2++){
                var d = sub[i2];
                var bxc = slotCx(i2);
                var bh = (durVals[i2] / durYMax) * cPlotH;
                var by = cY + cPadT + cPlotH - bh;
                var bcol = durCol(durVals[i2]);
                var isToday2 = d.day === TODAY_ISO;
                
                var q = d.quality_avg;
                var isGood = (hasN(q) && q >= 70) || (!hasN(q) && d.cycles <= targetCycles && durVals[i2] >= targetDur);
                var isBad = (hasN(q) && q < 40) || (!hasN(q) && (d.cycles > targetCycles * 1.5 || durVals[i2] < 20));
                var badge = isBad ? '⚠️' : (isGood ? '👑' : '');

                var barItems = [
