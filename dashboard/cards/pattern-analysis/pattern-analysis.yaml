                  items:[{t:'hl', k:t('spf_season'), v:(hasN(spf)?fmt1(spf):'—'), c:TH.purple},{t:'sep'},{t:'kv',k:'Target',v:'≥3.5',c:TH.sub}]},
                {lbl:t('week_trend'), val:degr, txt:(hasN(degr)?(degr>0?'+':'')+degr.toFixed(1).replace('.',',')+'%':'—'), col:(degr===null?TH.sub:(degr>=0?TH.green:TH.orange)),
                  items:[{t:'hl', k:t('week_trend'), v:(hasN(degr)?(degr>0?'+':'')+degr.toFixed(1)+'%':'—'), c:(degr===null?TH.sub:(degr>=0?TH.green:TH.orange))},{t:'sep'},{t:'kv',k:'Threshold',v:'-8%',c:TH.sub},{t:'kv',k:'Critical',v:'-15%',c:TH.sub}]},
                {lbl:t('buh_impact'), val:buhRt, txt:(hasN(buhRt)?fmtMin(buhRt/60):'—'), col:TH.buh,
                  items:[{t:'hl', k:t('buh_impact'), v:(hasN(buhRt)?fmtMin(buhRt/60):'—'), c:TH.buh},{t:'sep'},{t:'kv',k:'Seconds',v:(hasN(buhRt)?String(Math.round(buhRt)):'—'),c:TH.text}]},
                {lbl:t('defrost_n'), val:defrCnt, txt:(hasN(defrCnt)?Math.round(defrCnt)+'×':'—'), col:TH.defrost,
                  items:[{t:'hl', k:t('defrost_n'), v:(hasN(defrCnt)?Math.round(defrCnt)+'×':'—'), c:TH.defrost},{t:'sep'},{t:'kv',k:'Last 7d',v:'—',c:TH.sub}]}
              ];
              var sw = (W - P*2 - 3*3) / 4;
              for (var j=0; j<4; j++) {
                var st = stripDefs[j];
                var sx = P + j*(sw+3);
                var stripPop = popAttr({title:st.lbl, items:st.items});
                s += '<g '+stripPop+' style="cursor:pointer;">';
                s += '<rect x="'+sx+'" y="'+sY+'" width="'+sw+'" height="'+stripH+'" rx="6" fill="'+TH.bg2+'" stroke="'+TH.border+'" stroke-width="0.6"/>';
                s += T(sx+sw/2, sY+11, st.lbl, {a:'middle', s:6.5, w:900, f:TH.sub});
                s += T(sx+sw/2, sY+28, st.txt, {a:'middle', s:12, w:900, f:st.col, halo:1});
                s += '</g>';
              }

              /* ROW 6: Insight */
              var insight = null;
              if (hasN(modeData.heating.day) && dsRef !== null && modeData.heating.day < dsRef * 0.85) {
                insight = {bad:true, text:(LANG==='nl'?'COP heating '+fmt1(modeData.heating.day)+' onder datasheet':'COP heating '+fmt1(modeData.heating.day)+' below datasheet'),
                  items:[{t:'hl', k:'Heating COP', v:fmt1(modeData.heating.day), c:TH.red},{t:'kv',k:'Ref',v:fmt1(dsRef),c:TH.sub}]};
              } else if (hasN(degr) && degr < -8) {
                insight = {bad:true, text:(LANG==='nl'?'COP daalt '+degr.toFixed(1)+'% week':'COP dropping '+degr.toFixed(1)+'% week'),
                  items:[{t:'hl', k:'Week trend', v:degr.toFixed(1)+'%', c:TH.red},{t:'kv',k:'Threshold',v:'-8%',c:TH.sub}]};
              } else if (cntVals.some(function(v){ return v > targetCycles * 1.5; })) {
                insight = {bad:true, text:(LANG==='nl'?'Te veel cycli (target '+targetCycles+')':'Too many cycles (target '+targetCycles+')'),
                  items:[{t:'hl', k:'Peak cycles', v:String(Math.max.apply(null, cntVals)), c:TH.red},{t:'kv',k:'Target',v:String(targetCycles),c:TH.sub}]};
              } else if (hasN(spf) && spf >= 3.5) {
                insight = {bad:false, text:(LANG==='nl'?'SPF '+fmt1(spf)+' ruim boven doel':'SPF '+fmt1(spf)+' well above target'),
                  items:[{t:'hl', k:'SPF', v:fmt1(spf), c:TH.green},{t:'kv',k:'Target',v:'≥3.5',c:TH.sub}]};
              } else if (hasN(copToday) && dsRef !== null && copToday > dsRef) {
                insight = {bad:false, text:(LANG==='nl'?'COP boven datasheet referentie':'COP above datasheet reference'),
                  items:[{t:'hl', k:'COP', v:fmt1(copToday), c:TH.green},{t:'kv',k:'Ref',v:fmt1(dsRef),c:TH.sub}]};
              } else {
                insight = {bad:false, text:(LANG==='nl'?'Systeem presteert normaal':'System performing normally'),
                  items:[{t:'hl', k:'COP', v:fmt1(copToday), c:TH.green}]};
              }
              var insPop = popAttr({title:(insight.bad?'⚠️ ':'✅ ')+insight.text, items:insight.items});
              s += '<g '+insPop+' style="cursor:pointer;">';
              s += '<rect x="'+P+'" y="426" width="'+(W-P*2)+'" height="20" rx="6" fill="'+(insight.bad?'rgba(198,40,40,0.10)':'rgba(46,125,50,0.10)')+'"/>';
              s += T(P+8, 439, (insight.bad?'⚠️ ':'✅ ')+insight.text, {s:8, w:900, f:(insight.bad?TH.red:TH.green)});
              s += '</g>';

              return s;
            };

            /* BUILD WIN VIEW */
            var buildWinView = function(winSize){
              var sub = daysAll.slice(-winSize);
              var wkey = 'w'+winSize;
              var cls = String(winSize)===activeWin ? ' pa-view-active' : '';
              if(sub.length === 0){
                return '<div class="pa-view'+cls+'" data-win="'+winSize+'"><div class="pa-empty">⏳ '+(LANG==='nl'?'Geen data':'No data')+'</div></div>';
              }
              var wTotCycles = sub.reduce(function(a,d){ return a + d.cycles; }, 0);
              var wAvgQ = (function(){ var q = sub.filter(function(d){ return d.quality_avg !== null; }); return q.length>0 ? q.reduce(function(a,d){ return a+d.quality_avg; },0)/q.length : null; })();
              var wAvgDur = (function(){ var tot=0, cnt=0; sub.forEach(function(d){ tot += d.dur_total_min; cnt += d.cycles; }); return cnt>0 ? tot/cnt : 0; })();
              var half = Math.floor(sub.length/2);
              var _avgQ = function(arr){ var q = arr.filter(function(d){ return d.quality_avg !== null; }); return q.length>0 ? q.reduce(function(a,d){ return a+d.quality_avg; },0)/q.length : null; };
              var qF = _avgQ(sub.slice(0, half)), qS = _avgQ(sub.slice(half));
              var trendD = (qF !== null && qS !== null) ? (qS - qF) : null;
              var windowSet = {}; sub.forEach(function(d){ windowSet[d.day] = true; });
              var distCounts = [0,0,0,0];
              rawDays.forEach(function(rd){
                if(!rd.day || !windowSet[rd.day] || !rd.cycles || rd.cycles <= 0) return;
                var avg = rdDurAvg(rd);
                if(!isFinite(avg) || avg <= 0) return;
                var idx = avg<20?0:avg<60?1:avg<180?2:3;
                distCounts[idx] += rd.cycles;
              });
              var insightIcon='📊', insightText=(LANG==='nl'?'Onvoldoende data':'Insufficient data'), insightCol=TH.sub, insightBg='rgba(128,128,128,0.08)';
              if(distCounts[0] >= 3 && distCounts[0] >= distCounts[2]){
                insightIcon='🚨'; insightText=distCounts[0]+(LANG==='nl'?' cycli in PENDEL zone':' cycles in PENDULUM zone');
                insightCol=TH.red; insightBg='rgba(198,40,40,0.10)';
              } else if(distCounts[2] >= 3 && distCounts[0] <= 1){
                insightIcon='✅'; insightText=distCounts[2]+(LANG==='nl'?' cycli in IDEAAL zone':' cycles in IDEAL zone');
                insightCol=TH.green; insightBg='rgba(46,125,50,0.10)';
              } else if(wAvgQ !== null && wAvgQ >= 70){
                insightIcon='⭐'; insightText=(LANG==='nl'?'Gemiddelde kwaliteit ':'Average quality ')+vI(wAvgQ)+'%';
                insightCol=TH.green; insightBg='rgba(46,125,50,0.08)';
              } else if(wAvgQ !== null && wAvgQ < 40){
                insightIcon='⚠️'; insightText=(LANG==='nl'?'Gemiddelde kwaliteit laag (':'Average quality low (')+vI(wAvgQ)+'%)';
                insightCol=TH.red; insightBg='rgba(198,40,40,0.08)';
              } else if(trendD !== null && trendD > 5){
                insightIcon='📈'; insightText=(LANG==='nl'?'Kwaliteit stijgt (+':'Quality rising (+')+vI(trendD)+'%)';
                insightCol=TH.green; insightBg='rgba(46,125,50,0.08)';
              } else if(trendD !== null && trendD < -5){
                insightIcon='📉'; insightText=(LANG==='nl'?'Kwaliteit daalt (':'Quality dropping (')+vI(trendD)+'%)';
                insightCol=TH.orange; insightBg='rgba(230,81,0,0.08)';
              } else if(wTotCycles > 0){
                insightIcon='🎯'; insightText=wTotCycles+(LANG==='nl'?' cycli over ':' cycles over ')+sub.length+'d · Ø '+fmtMin(wAvgDur);
                insightCol=TH.text; insightBg='rgba(21,101,192,0.08)';
              }
              var copHdrVal = getState(resolveEntity('cop_today'));
              var hd = function(tab, title, right){ return '<div class="pa-hdr" data-tab-hdr="'+tab+'"><span>'+title+'</span><span class="pa-hdr-right">'+right+' · '+sub.length+'d</span></div>'; };
              var hdrs = hd('dist', t('hdr_dist'), wTotCycles+'× · Ø '+fmtMin(wAvgDur))
                       + hd('scatter', t('hdr_scatter'), t('cnt_perday'))
                       + hd('cop', t('hdr_cop'), 'COP '+fmt1(copHdrVal));
              return '<div class="pa-view'+cls+'" data-win="'+winSize+'">'
                + hdrs
                + '<div class="pa-insight" style="background:'+insightBg+';border-left-color:'+insightCol+';">'
                + '<span class="pa-insight-icon">'+insightIcon+'</span>'
                + '<span class="pa-insight-text" style="color:'+insightCol+';">'+insightText+'</span>'
                + '</div>'
                + '<svg class="pa-svg pa-svg-dist" viewBox="0 0 460 260" preserveAspectRatio="xMidYMid meet">'+buildDistContent(sub, wkey)+'</svg>'
                + '<svg class="pa-svg pa-svg-scatter" viewBox="0 0 460 350" preserveAspectRatio="xMidYMid meet">'+buildScatterContent(sub, wkey)+'</svg>'
                + '<svg class="pa-svg pa-svg-cop" viewBox="0 0 460 460" preserveAspectRatio="xMidYMid meet">'+buildCopContent(sub, wkey)+'</svg>'
                + '</div>';
            };

            var chip = function(color, bg, label){
              return '<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:9px;background:'+bg+';border:1px solid '+color+'55;font-size:0.68em;font-weight:900;color:'+color+';white-space:nowrap;line-height:1.2;"><span style="width:6px;height:6px;border-radius:50%;background:'+color+';flex-shrink:0;"></span>'+label+'</span>';
            };
            var legendDist = '<div class="pa-legend" data-tab-leg="dist">'
              + chip(TH.red, DARK?'rgba(239,83,80,0.10)':'#FFEBEE', (LANG==='nl'?'PENDEL <20m':'PENDULUM <20m'))
              + chip(TH.orange, DARK?'rgba(255,167,38,0.10)':'#FFF3E0', 'SHORT 20-60m')
              + chip(TH.green, DARK?'rgba(102,187,106,0.10)':'#E8F5E9', 'GOOD 60-180m')
              + chip(TH.blue, DARK?'rgba(66,165,245,0.10)':'#E3F2FD', 'LONG >180m')
              + '</div>';
            var legendScatter = '<div class="pa-legend" data-tab-leg="scatter">'
              + chip(TH.red, DARK?'rgba(239,83,80,0.10)':'#FFEBEE', '🚨 pendel')
              + chip(TH.orange, DARK?'rgba(255,167,38,0.10)':'#FFF3E0', '⚠️ mixed')
              + chip(TH.green, DARK?'rgba(102,187,106,0.10)':'#E8F5E9', '✅ ideaal')
              + '</div>';
            var tabDefs = [{id:'dist', label:t('tab_dist')}, {id:'scatter', label:t('tab_scatter')}, {id:'cop', label:t('tab_cop')}];
            var tabBar = '<div class="pa-tabbar">';
            for(var ti=0; ti<tabDefs.length; ti++){
              var td = tabDefs[ti];
              var act = (td.id === activeTab) ? ' pa-tab-active' : '';
              tabBar += '<div class="pa-tab'+act+'" data-pa-action="tab" data-pa-arg="'+td.id+'">'+td.label+'</div>';
            }
            tabBar += '</div>';
            var winGroup = '<div class="pa-win-group">';
            [7,15,30].forEach(function(w){
              var act = (String(w) === activeWin) ? ' pa-active' : '';
              winGroup += '<div class="pa-win-btn'+act+'" data-pa-action="win" data-pa-arg="'+w+'">'+w+'d</div>';
            });
            winGroup += '</div>';
            var actions = '<div class="pa-actions">' + winGroup + '</div>';
            var notes = '<div class="pa-notes">'
              + '<div class="pa-note" data-tab-note="dist">'+t('note_dist')+'</div>'
              + '<div class="pa-note" data-tab-note="scatter">'+t('note_scatter')+'</div>'
              + '<div class="pa-note" data-tab-note="cop">'+t('note_cop')+'</div>'
              + '</div>';
            var css = '<style>'
              + '.pa-chart{position:relative;touch-action:manipulation;font-family:ui-monospace,monospace;animation:pa-fade .4s ease-out;}'
              + '@keyframes pa-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}'
              + '@keyframes pa-popInAbove{from{opacity:0;transform:translateY(-100%) scale(.94)}to{opacity:1;transform:translateY(-100%) scale(1)}}'
              + '@keyframes pa-popInBelow{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}'
              + '@keyframes pa-popOut{from{opacity:1}to{opacity:0}}'
              + '@keyframes pa-popBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}'
              + '.pa-tabbar{display:flex;gap:5px;padding:6px 8px 4px 8px;}'
              + '.pa-tab{flex:1 1 0;min-width:0;padding:11px 6px;border-radius:11px;border:2.5px solid '+TH.accent+';background:'+TH.bg+';color:'+TH.accent+';font-family:inherit;font-size:0.68em;font-weight:900;text-transform:uppercase;letter-spacing:0.4px;cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center;}'
              + '.pa-tab:active{transform:scale(.96);}'
              + '.pa-tab.pa-tab-active{background:'+TH.accent+';color:#fff;box-shadow:0 3px 12px rgba(25,118,210,.45);}'
              + '.pa-actions{display:flex;gap:6px;justify-content:flex-start;align-items:center;padding:2px 8px 4px 8px;}'
              + '.pa-win-group{display:flex;gap:3px;background:'+(DARK?'rgba(100,181,246,0.12)':'rgba(25,118,210,0.08)')+';border-radius:11px;padding:3px;}'
              + '.pa-win-btn{padding:8px 12px;border-radius:8px;background:transparent;color:'+TH.accent+';font-family:inherit;font-size:0.72em;font-weight:900;cursor:pointer;transition:all .18s;user-select:none;letter-spacing:0.3px;min-width:44px;text-align:center;}'
              + '.pa-win-btn:active{transform:scale(.94);}'
              + '.pa-win-btn.pa-active{background:'+TH.accent+';color:#fff;box-shadow:0 2px 8px rgba(25,118,210,.35);}'
              + '.pa-hdr{display:none;padding:4px 12px 6px 12px;font-family:ui-monospace,monospace;font-size:0.72em;font-weight:900;text-transform:uppercase;letter-spacing:0.5px;color:'+TH.text+';justify-content:space-between;align-items:center;gap:6px;}'
              + '.pa-hdr .pa-hdr-right{color:'+TH.accent+';}'
              + '.pa-legend{display:none;flex-wrap:wrap;gap:4px;align-items:center;padding:8px 12px 4px 12px;}'
              + '.pa-chart[data-tab="dist"] .pa-hdr[data-tab-hdr="dist"]{display:flex;}'
              + '.pa-chart[data-tab="scatter"] .pa-hdr[data-tab-hdr="scatter"]{display:flex;}'
              + '.pa-chart[data-tab="cop"] .pa-hdr[data-tab-hdr="cop"]{display:flex;}'
              + '.pa-chart[data-tab="dist"] .pa-legend[data-tab-leg="dist"]{display:flex;}'
              + '.pa-chart[data-tab="scatter"] .pa-legend[data-tab-leg="scatter"]{display:flex;}'
              + '.pa-view{display:none;}'
              + '.pa-chart[data-win="7"] .pa-view[data-win="7"]{display:block;}'
              + '.pa-chart[data-win="15"] .pa-view[data-win="15"]{display:block;}'
              + '.pa-chart[data-win="30"] .pa-view[data-win="30"]{display:block;}'
              + '.pa-svg{display:none;width:100%;height:auto;}'
              + '.pa-chart[data-tab="dist"] .pa-svg-dist{display:block;}'
              + '.pa-chart[data-tab="scatter"] .pa-svg-scatter{display:block;}'
              + '.pa-chart[data-tab="cop"] .pa-svg-cop{display:block;}'
              + '.pa-insight{background:'+TH.bg2+';border-left:4px solid '+TH.accent+';border-radius:8px;padding:8px 12px;margin:4px 10px 8px 10px;display:flex;align-items:center;gap:10px;box-sizing:border-box;}'
              + '.pa-insight-icon{font-size:1.3em;line-height:1;flex-shrink:0;}'
              + '.pa-insight-text{font-family:ui-monospace,monospace;font-size:0.72em;font-weight:900;line-height:1.35;}'
              + '.pa-empty{padding:32px;text-align:center;color:'+TH.sub+';font-weight:900;font-size:0.85em;}'
              + '.pa-notes{display:block;padding:4px 12px 10px 12px;width:100%;box-sizing:border-box;}'
              + '.pa-note{display:none;font-size:0.65em;line-height:1.45;font-weight:700;color:'+TH.sub+';background:'+(DARK?'rgba(100,181,246,0.06)':'rgba(25,118,210,0.04)')+';border-radius:8px;padding:7px 10px;font-family:ui-monospace,monospace;white-space:normal;word-break:break-word;}'
              + '.pa-chart[data-tab="dist"] .pa-note[data-tab-note="dist"]{display:block;}'
              + '.pa-chart[data-tab="scatter"] .pa-note[data-tab-note="scatter"]{display:block;}'
              + '.pa-chart[data-tab="cop"] .pa-note[data-tab-note="cop"]{display:block;}'
              + '.pa-hit{cursor:pointer;}'
              + '.pa-hit:hover{filter:brightness(1.08);}'
              + '.pa-popup-host{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:visible;z-index:200;}'
              + '.pa-popup{position:absolute;width:250px;max-width:92%;background:'+TH.bg+';border:2.5px solid '+TH.accent+';border-radius:12px;padding:0;box-shadow:0 14px 34px '+(DARK?'rgba(0,0,0,0.55)':'rgba(25,118,210,0.35)')+',0 2px 6px rgba(0,0,0,0.12);pointer-events:auto;z-index:201;overflow:hidden;cursor:pointer;}'
              + '.pa-popup.popup-above{animation:pa-popInAbove .18s ease-out forwards;transform:translateY(-100%);}'
              + '.pa-popup.popup-below{animation:pa-popInBelow .18s ease-out forwards;}'
              + '.pa-popup.pa-popup-out{animation:pa-popOut .22s ease-in forwards;}'
              + '.pa-popup-hd{background:linear-gradient(135deg,'+TH.accent+','+TH.accent2+');color:white;padding:8px 12px;font-weight:900;font-size:0.82em;letter-spacing:0.4px;display:flex;justify-content:space-between;align-items:center;gap:6px;}'
              + '.pa-popup-ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}'
              + '.pa-popup-x{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,0.25);display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;}'
              + '.pa-popup-hl{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:0.82em;font-weight:900;background:'+(DARK?'rgba(100,181,246,0.10)':'rgba(25,118,210,0.06)')+';}'
              + '.pa-popup-hl-k{color:'+TH.sub+';}'
              + '.pa-popup-hl-v{font-family:ui-monospace,monospace;font-size:1.35em;font-weight:900;line-height:1;}'
              + '.pa-popup-row{display:flex;justify-content:space-between;align-items:center;padding:4px 12px;font-size:0.74em;font-weight:800;}'
              + '.pa-popup-row+.pa-popup-row{border-top:1px dashed '+(DARK?'rgba(255,255,255,0.10)':'rgba(25,118,210,0.08)')+';}'
              + '.pa-popup-sep{height:2px;background:'+(DARK?'rgba(255,255,255,0.14)':'rgba(25,118,210,0.14)')+';margin:2px 0;}'
              + '.pa-popup-k{color:'+TH.sub+';}'
              + '.pa-popup-v{font-family:ui-monospace,monospace;font-weight:900;font-size:1.05em;}'
              + '.pa-popup-modes{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;background:'+(DARK?'rgba(100,181,246,0.06)':'rgba(25,118,210,0.03)')+';}'
              + '.pa-popup-mode{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:6px;background:'+(DARK?'rgba(100,181,246,0.12)':'rgba(25,118,210,0.08)')+';color:'+TH.text+';font-size:0.72em;font-weight:800;}'
              + '.pa-popup-mode-ic{font-size:1.05em;}'
              + '.pa-popup-mode-c{font-weight:900;}'
              + '.pa-popup-mode-d{color:'+TH.sub+';}'
              + '.pa-popup-mode-q{font-weight:900;}'
              + '.pa-popup-bar{height:3px;background:'+TH.accent+';width:100%;transform-origin:left center;animation:pa-popBar 5s linear forwards;}'
              + '</style>';

            var r = '<div class="pa-chart" data-tab="'+activeTab+'" data-win="'+activeWin+'" style="width:100%;box-sizing:border-box;position:relative;">';
            r += css;
            r += tabBar;
            r += actions;
            r += buildWinView(7);
            r += buildWinView(15);
            r += buildWinView(30);
            r += '<div class="pa-legends">' + legendDist + legendScatter + '</div>';
            r += notes;
            r += '<div class="pa-popup-host"></div>';
            r += '<div style="height:4px;"></div>';
            r += '</div>';
            return r;
          } catch(e) {
            return '<div style="padding:16px;color:#C62828;font-family:monospace;font-weight:800;font-size:0.75em;">⚠️ Pattern error: ' + (e && e.message ? e.message : e) + '</div>';
          }
        ]]]