type: custom:stack-in-card
variables:
  lang_override: ''
  default_tab: 'dist'
  default_window: 7
  chart_height: 280
  show_hints: true
card_mod:
  style: |
    ha-card {
      border: 3px solid var(--primary-color, #1976D2);
      border-radius: 16px;
      background: var(--ha-card-background, #F5FAFE);
      background: linear-gradient(180deg,
        color-mix(in srgb, var(--ha-card-background, #F5FAFE) 92%, var(--primary-color, #1976D2)) 0%,
        color-mix(in srgb, var(--ha-card-background, #F5FAFE) 88%, var(--primary-color, #1976D2)) 50%,
        color-mix(in srgb, var(--ha-card-background, #F5FAFE) 84%, var(--primary-color, #1976D2)) 100%);
      box-shadow: 0 10px 28px color-mix(in srgb, var(--primary-color, #1976D2) 20%, transparent);
      overflow: visible;
    }
cards:
  - type: custom:mushroom-template-card
    primary: >-
      🎯 DAIKIN CYCLE ML — PATTERN ANALYSIS{{ ' · ' +
      (state_attr('sensor.daikin_cycle_ml_hp_specs','model')|string|upper) if
      state_attr('sensor.daikin_cycle_ml_hp_specs','model') else '' }}
    secondary: >-
      {% set l = state_attr('sensor.daikin_cycle_ml_cycle_state','configured_language') or 'en' -%}
      {% if l == 'nl' %}Verdeling · cycles vs duration · COP-efficiëntie{% else %}Distribution · cycles vs duration · COP efficiency{% endif %}
    icon: mdi:chart-scatter-plot
    icon_color: blue
    multiline_secondary: true
    card_mod:
      style: >
        ha-card {
          background: linear-gradient(135deg,
            color-mix(in srgb, var(--ha-card-background, #fff) 85%, var(--primary-color, #1976D2)) 0%,
            color-mix(in srgb, var(--ha-card-background, #fff) 70%, var(--primary-color, #1976D2)) 100%) !important;
          box-shadow: none;
          border-bottom: 3px solid var(--primary-color, #1976D2);
          border-radius: 0;
          padding: 12px 16px;
        }

        .primary { color: var(--primary-text-color, #0D47A1) !important;
        font-weight: 900 !important; font-size: 1.05em !important;
        text-transform: uppercase; letter-spacing: 0.8px; }

        .secondary { color: var(--primary-color, #1565C0) !important; font-size:
        0.88em !important; font-weight: 800 !important; }
  - type: custom:button-card
    show_name: false
    show_icon: false
    triggers_update: all
    tap_action:
      action: javascript
      javascript: |
        [[[
          try {
            const card = this;
            const root = card.shadowRoot || card.getRootNode?.() || card;
            const chart = root.querySelector('.pa-chart');
            if (!chart) return;
            const openPop = chart.querySelector('.pa-popup');
            if (openPop) {
              const hovered = Array.from(root.querySelectorAll(':hover, :active'));
              for (const el of hovered) {
                if (el.closest && el.closest('.pa-popup')) {
                  if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                  openPop.classList.add('pa-popup-out');
                  setTimeout(() => { if (openPop.parentNode) openPop.parentNode.removeChild(openPop); }, 200);
                  return;
                }
              }
            }
            let candidates = Array.from(root.querySelectorAll(':hover, :active')).reverse();
            if (!candidates.length) candidates = Array.from(root.querySelectorAll('[data-pa-action]')).reverse();
            for (const el of candidates) {
              if (!el || !el.dataset) continue;
              const action = el.dataset.paAction;
              if (!action) continue;
              if (action === 'tab') {
                const arg = el.dataset.paArg;
                window.__paTab = arg;
                chart.setAttribute('data-tab', arg);
                chart.querySelectorAll('.pa-tab').forEach(t => t.classList.toggle('pa-tab-active', t.dataset.paArg === arg));
                return;
              }
              if (action === 'win') {
                const arg = el.dataset.paArg;
                window.__paWin = arg;
                chart.setAttribute('data-win', arg);
                chart.querySelectorAll('.pa-win-btn').forEach(b => b.classList.toggle('pa-active', b.dataset.paArg === arg));
                chart.querySelectorAll('.pa-view').forEach(v => v.classList.toggle('pa-view-active', v.dataset.win === arg));
                return;
              }
              if (action === 'popup') { window.__paPopup(el); return; }
              if (action === 'close-popup') {
                const popup = el.closest('.pa-popup') || el;
                if (popup && popup.parentNode) {
                  if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                  popup.classList.add('pa-popup-out');
                  setTimeout(() => { if (popup.parentNode) popup.parentNode.removeChild(popup); }, 200);
                }
                return;
              }
            }
          } catch(e) { console.warn('[PA]', e); }
        ]]]
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 6px 6px 2px 6px
        - overflow: visible
      grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
      custom_fields:
        content:
          - width: 100%
          - pointer-events: auto
    custom_fields:
      content: |
        [[[
          try {
            var card = this;
            card.__paRegistry = card.__paRegistry || {};
            card.__paSeq = 0;
            
            var CFG = (typeof variables !== 'undefined' && variables) ? variables : {};
            var cfgTab = String(CFG.default_tab || 'dist');
            var cfgWin = parseInt(CFG.default_window, 10) || 7;
            var cfgShowHints = CFG.show_hints !== false;
            var cfgLangOvr = String(CFG.lang_override || '').toLowerCase();

            var REGISTRY = {
              daily_summary: ['daily_summary_recent','recent_dagoverzicht'],
              hp_specs: ['hp_specs','wp_specs'],
              cycle_state: ['cycle_state','cyclus_status'],
              compressor_starts: ['compressor_starts_today','compressorstarts_vandaag'],
              runtime_buh: ['runtime_buh_today','buh_bedrijfstijd_vandaag'],
              defrost_count: ['defrost_count_today','ontdooiingen_vandaag'],
              defrost_duration: ['defrost_duration_today','ontdooiingsduur_vandaag'],
              duty_cycle: ['duty_cycle_today','duty_cycle_vandaag'],
              cop_today: ['cop_today','cop_vandaag'],
              cop_heating_day: ['cop_heating_day','cop_verwarming_dag'],
              cop_heating_week: ['cop_heating_week','cop_verwarming_week'],
              cop_heating_month: ['cop_heating_month','cop_verwarming_maand'],
              cop_dhw_day: ['cop_dhw_day','cop_dhw_dag'],
              cop_dhw_week: ['cop_dhw_week','cop_dhw_week'],
              cop_dhw_month: ['cop_dhw_month','cop_dhw_maand'],
              cop_cooling_day: ['cop_cooling_day','cop_koeling_dag'],
              cop_cooling_week: ['cop_cooling_week','cop_koeling_week'],
              cop_cooling_month: ['cop_cooling_month','cop_koeling_maand'],
              spf_season: ['spf_season','spf_seizoen'],
              cop_degradation_week: ['cop_degradation_week_pct','cop_degradatie_week_pct'],
              learned_thresholds: ['learned_thresholds','geleerde_drempels'],
              cop_curve_recent: ['cop_curve_recent'],
              cop_vs_datasheet_pct: ['cop_vs_datasheet_pct']
            };

            var resolveEntity = function(role){
              var names = REGISTRY[role];
              if(!names) return null;
              var all = Object.keys(states).filter(function(e){ return e.indexOf('sensor.') === 0; });
              var preferred = all.filter(function(e){ return e.indexOf('daikin_cycle_ml') !== -1; });
              var i, j;
              for(i=0; i<preferred.length; i++){
                for(j=0; j<names.length; j++){
                  if (preferred[i].endsWith('_'+names[j])) return preferred[i];
                }
              }
              for(i=0; i<all.length; i++){
                for(j=0; j<names.length; j++){
                  if (all[i].endsWith('_'+names[j])) return all[i];
                }
              }
              return null;
            };

            var SUMMARY = resolveEntity('daily_summary');
            var STATE = resolveEntity('cycle_state');
            var HP_SPECS = resolveEntity('hp_specs');
            var TODAY_ISO = new Date().toISOString().slice(0,10);

            if (!SUMMARY) {
              return '<div style="padding:16px;color:#C62828;font-weight:800;">⚠️ Daikin Cycle ML entities niet gevonden.<br>Controleer of de integratie draait.<br>Gezocht: sensor.*_daily_summary_recent / *_recent_dagoverzicht + *cycle_state / *cyclus_status</div>';
            }

            var hasV = function(v){ return v!==null && v!==undefined && v!=='' && String(v)!=='None' && String(v)!=='unknown' && String(v)!=='unavailable'; };
            var hasN = function(v){ if (!hasV(v)) return false; var f = parseFloat(v); return isFinite(f); };
            var vI = function(v){ if(!hasV(v)||isNaN(parseFloat(v)))return '—'; return Math.round(parseFloat(v)).toString(); };
            var attr = function(id,n,d){ try{ if(!id)return d; var a=states[id] && states[id].attributes; if(!a)return d; var v=a[n]; if(v===undefined||v===null||String(v)==='None')return d; return v; } catch(e){ return d; } };
            var getState = function(eid){ try { var st = states[eid]; if (!st) return null; var v = parseFloat(st.state); return isFinite(v) ? v : null; } catch(e){ return null; } };
            var weekday = function(iso){ if(!iso) return ''; try{ var d = new Date(iso + 'T12:00:00'); return ['zo','ma','di','wo','do','vr','za'][d.getDay()]; }catch(e){ return ''; } };
            var fmtDay = function(iso){ if(!iso) return '—'; var p=String(iso).split('-'); return p.length>=3 ? p[2]+'/'+p[1] : iso; };
            var fmtMin = function(m){
              if(!hasV(m)||!isFinite(Number(m))) return '—';
              m = Number(m);
              if(m < 60) return Math.round(m)+'m';
              var h = Math.floor(m/60); var mm = Math.round(m - h*60);
              return mm === 0 ? h+'u' : h+'u'+String(mm).padStart(2,'0');
            };
            var fmt1 = function(v){ return hasN(v) ? Number(v).toFixed(1).replace('.',',') : '—'; };
            var pct  = function(v){ return hasN(v) ? (Number(v)>0?'+':'') + Number(v).toFixed(1).replace('.',',') + '%' : '—'; };
            var arrow = function(v){ return !hasN(v) ? '' : (Number(v)>0?'▲':Number(v)<0?'▼':'●'); };

            /* THEME */
            var DARK = !!(hass && hass.themes && hass.themes.darkMode);
            var TH = {
              dark: DARK,
              bg: DARK ? 'var(--card-background-color, #1C1C1E)' : 'var(--card-background-color, #FFFFFF)',
              bg2: DARK ? 'var(--secondary-background-color, #2C2C2E)' : 'var(--secondary-background-color, #F5FAFE)',
              text: DARK ? 'var(--primary-text-color, #E5E5EA)' : 'var(--primary-text-color, #0D47A1)',
              sub: DARK ? 'var(--secondary-text-color, #AEAEB2)' : 'var(--secondary-text-color, #546E7A)',
              accent: DARK ? 'var(--primary-color, #64B5F6)' : 'var(--primary-color, #1976D2)',
              accent2: DARK ? '#90CAF9' : '#0D47A1',
              border: DARK ? 'rgba(255,255,255,0.14)' : 'rgba(13,71,161,0.12)',
              grid: DARK ? 'rgba(255,255,255,0.07)' : 'rgba(13,71,161,0.08)',
              green: DARK ? '#66BB6A' : '#2E7D32',
              orange: DARK ? '#FFA726' : '#E65100',
              red: DARK ? '#EF5350' : '#C62828',
              blue: DARK ? '#42A5F5' : '#1976D2',
              purple: DARK ? '#BA68C8' : '#6A1B9A',
              buh: DARK ? '#FFA726' : '#E65100',
              defrost: DARK ? '#42A5F5' : '#1976D2'
            };
            var TXT_HALO = DARK
              ? 'paint-order="stroke fill" stroke="#000" stroke-width="2.5" stroke-opacity="0.65" stroke-linejoin="round"'
              : 'paint-order="stroke fill" stroke="white" stroke-width="2.5" stroke-opacity="0.9" stroke-linejoin="round"';

            var qColor = function(q){ return (q===null||q===undefined) ? TH.sub : (q>=70?TH.green:q>=40?TH.orange:TH.red); };
            var durCol = function(m){ return m<20?TH.red:m<60?TH.orange:m<180?TH.green:TH.blue; };
            var MODE_COL = { heating: TH.red, dhw: TH.blue, cooling: '#42A5F5' };
            var MODE_ICON = { heating: '🔥', dhw: '🚿', cooling: '🧊' };

            var T = function(x, y, text, o){
              o = o || {};
              return '<text x="'+x+'" y="'+y+'"'
                + (o.a ? ' text-anchor="'+o.a+'"' : '')
                + ' font-family="ui-monospace,monospace"'
                + ' font-size="'+(o.s||10)+'"'
                + ' font-weight="'+(o.w||800)+'"'
                + ' fill="'+(o.f||TH.text)+'"'
                + (o.halo ? ' '+TXT_HALO : '')
                + (o.attr ? ' '+o.attr : '')
                + '>'+text+'</text>';
            };

            if (!window.__paRegistry) window.__paRegistry = {};
            if (!window.__paRegSeq) window.__paRegSeq = 0;
            if (window.__paRegSeq > 900) { window.__paRegistry = {}; window.__paRegSeq = 0; }
            var popAttr = function(payload){
              window.__paRegSeq++;
              var id = 'p' + window.__paRegSeq;
              window.__paRegistry[id] = payload;
              return 'data-pa-action="popup" data-pa-pid="'+id+'"';
            };

            if (!window.__paPopup) {
              window.__paPopup = function(el){
                try {
                  var chart = el.closest('.pa-chart'); if(!chart) return;
                  var host = chart.querySelector('.pa-popup-host'); if(!host) return;
                  var pid = el.getAttribute('data-pa-pid'); if(!pid) return;
                  var payload = window.__paRegistry[pid]; if(!payload) return;
                  var now = Date.now();
                  if (chart.__paLastTap && (now - chart.__paLastTap) < 180) return;
                  chart.__paLastTap = now;
                  var oldPops = host.querySelectorAll('.pa-popup');
                  for (var i=0; i<oldPops.length; i++) if(oldPops[i].parentNode) oldPops[i].parentNode.removeChild(oldPops[i]);
                  if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                  var pop = document.createElement('div');
                  pop.className = 'pa-popup'; pop.setAttribute('data-pa-action','close-popup');
                  var html = '<div class="pa-popup-hd"><span class="pa-popup-ttl">' + payload.title + '</span><span class="pa-popup-x">✕</span></div>';
                  if (payload.items) for (var j=0; j<payload.items.length; j++) {
                    var it = payload.items[j];
                    if (it.t === 'sep') { html += '<div class="pa-popup-sep"></div>'; continue; }
                    if (it.t === 'hl') { html += '<div class="pa-popup-hl"><span class="pa-popup-hl-k">'+it.k+'</span><span class="pa-popup-hl-v" style="color:'+(it.c||TH.accent)+'">'+it.v+'</span></div>'; continue; }
                    html += '<div class="pa-popup-row"><span class="pa-popup-k">'+it.k+'</span><span class="pa-popup-v" style="color:'+(it.c||TH.text)+'">'+it.v+'</span></div>';
                  }
                  if (payload.modes && payload.modes.length) {
                    html += '<div class="pa-popup-sep"></div><div class="pa-popup-modes">';
                    for (var mi=0; mi<payload.modes.length; mi++) {
                      var md = payload.modes[mi];
                      html += '<div class="pa-popup-mode"><span class="pa-popup-mode-ic">'+md.icon+'</span><span class="pa-popup-mode-c">'+md.cycles+'×</span><span class="pa-popup-mode-d">'+md.dur+'</span><span class="pa-popup-mode-q" style="color:'+(md.qc||TH.sub)+'">Q'+md.q+'</span></div>';
                    }
                    html += '</div>';
                  }
                  html += '<div class="pa-popup-bar"></div>';
                  pop.innerHTML = html;
                  pop.style.visibility='hidden'; pop.style.left='0px'; pop.style.top='0px';
                  host.appendChild(pop);
                  var chartRect = chart.getBoundingClientRect();
                  var rect; try { rect = el.getBoundingClientRect(); } catch(e){ rect = null; }
                  var pw = pop.offsetWidth || 250, ph = pop.offsetHeight || 200;
                  var ex=0, ey=40, ew=100, eh=20;
                  if (rect && rect.width > 0) { ex = rect.left - chartRect.left; ey = rect.top - chartRect.top; ew = rect.width; eh = rect.height; } else { ex = chartRect.width/2 - 50; }
                  var GAP = 12, MARGIN = 6;
                  var left = ex + ew/2 - pw/2;
                  if (left < MARGIN) left = MARGIN;
                  if (left + pw > chartRect.width - MARGIN) left = chartRect.width - pw - MARGIN;
                  var placeAbove = (ey - GAP - ph) >= MARGIN;
                  var top;
                  if (placeAbove) { top = ey - GAP; pop.classList.add('popup-above'); }
                  else { var belowTop = ey + eh + GAP; top = (belowTop+ph <= chartRect.height-MARGIN) ? belowTop : (MARGIN+4); pop.classList.add('popup-below'); }
                  pop.style.left = left+'px'; pop.style.top = top+'px'; pop.style.visibility='visible';
                  pop.addEventListener('click', function(ev){
                    ev.stopImmediatePropagation(); ev.stopPropagation(); ev.preventDefault();
                    if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                    pop.classList.add('pa-popup-out');
                    setTimeout(function(){ if (pop.parentNode) pop.parentNode.removeChild(pop); }, 200);
                  }, true);
                  chart.__paTimer = setTimeout(function(){
                    if (pop && pop.parentNode) { pop.classList.add('pa-popup-out'); setTimeout(function(){ if (pop.parentNode) pop.parentNode.removeChild(pop); }, 250); }
                    chart.__paTimer = null;
                  }, 5000);
                } catch(e){ console.warn('[PA popup]', e); }
              };
            }

            var cfgLang = String(attr(STATE,'configured_language','en')).toLowerCase();
            var haLang = (typeof hass !== 'undefined' && hass && hass.language) ? String(hass.language).toLowerCase() : '';
            var LANG = 'en';
            if (cfgLangOvr === 'nl' || cfgLangOvr === 'en') { LANG = cfgLangOvr; }
            else if (haLang.indexOf('nl') === 0) { LANG = 'nl'; }
            else if (cfgLang === 'nl') { LANG = 'nl'; }

            var I18N = {
              hdr_dist: {nl:'📊 Verdeling cyclus-duur', en:'📊 Cycle duration distribution'},
              hdr_scatter: {nl:'🎯 Cycles vs Duur', en:'🎯 Cycles vs Duration'},
              hdr_cop: {nl:'🎯 COP Efficiëntie', en:'🎯 COP Efficiency'},
              cnt_perday: {nl:'per dag', en:'per day'},
              tab_dist: {nl:'📊 VERDELING', en:'📊 DISTRIBUTION'},
              tab_scatter: {nl:'🎯 SCATTER', en:'🎯 SCATTER'},
              tab_cop: {nl:'🎯 COP', en:'🎯 COP'},
              axis_x_cyc: {nl:'CYCLES PER DAG', en:'CYCLES PER DAY'},
              axis_y_dur: {nl:'GEM. DUUR', en:'AVG DURATION'},
              r_cycles: {nl:'Cycli', en:'Cycles'},
              r_avgdur: {nl:'Ø duur', en:'Ø duration'},
              r_maxdur: {nl:'Langste', en:'Longest'},
              r_totaldur: {nl:'Totale duur', en:'Total runtime'},
              r_quality: {nl:'Kwaliteit', en:'Quality'},
              r_buh: {nl:'⚡ BUH', en:'⚡ BUH'},
              r_defrost: {nl:'❄ Defrost', en:'❄ Defrost'},
              r_days: {nl:'Dagen', en:'Days'},
              r_share: {nl:'Aandeel', en:'Share'},
              r_samples: {nl:'Samples', en:'Samples'},
              note_dist: {nl:'💡 Tik op een balk voor details — buckets op basis van gemiddelde cyclusduur per modus', en:'💡 Tap a bar for details — buckets by avg cycle duration per mode'},
              note_scatter: {nl:'💡 Tik op een punt voor details — X: cycli/dag · Y: gem. duur · kleur: kwaliteit', en:'💡 Tap a dot for details — X: cycles/day · Y: avg duration · color: quality'},
              note_cop: {nl:'💡 COP = efficiëntie · ~ref = benaderde datasheet-vergelijking (A7/W35) · duur/cycli-trends per dag', en:'💡 COP = efficiency · ~ref = approximate datasheet comparison (A7/W35) · duration/cycle trends per day'},
              cop_today: {nl:'COP VANDAAG', en:'COP TODAY'},
              cop_vs_ds: {nl:'VS DATASHEET', en:'VS DATASHEET'},
              spf_season: {nl:'SPF SEIZOEN', en:'SPF SEASON'},
              week_trend: {nl:'WEEKTREND', en:'WEEK TREND'},
              buh_impact: {nl:'⚡ BUH', en:'⚡ BUH'},
              defrost_n: {nl:'❄ DEFROST', en:'❄ DEFROST'},
              no_cop_data: {nl:'Geen COP-data', en:'No COP data'}
            };
            var t = function(k){ var e=I18N[k]; if(!e) return k; return e[LANG] || e.en || e.nl; };

            var rawDays = attr(SUMMARY, 'days', []);
            if(!Array.isArray(rawDays)) rawDays = [];
            var rdDurMin = function(rd){ return hasN(rd.dur_min) ? parseFloat(rd.dur_min) : (hasN(rd.total_duration_s) ? parseFloat(rd.total_duration_s)/60 : 0); };
            var rdDurMax = function(rd){ return hasN(rd.dur_max) ? parseFloat(rd.dur_max) : (hasN(rd.duration_max) ? parseFloat(rd.duration_max)/60 : 0); };
            var rdDurAvg = function(rd){
              if (hasN(rd.dur_min_avg)) return parseFloat(rd.dur_min_avg);
              if (hasN(rd.duration_avg)) return parseFloat(rd.duration_avg)/60;
              if (hasN(rd.dur_min) && rd.cycles > 0) return parseFloat(rd.dur_min)/rd.cycles;
              if (hasN(rd.total_duration_s) && rd.cycles > 0) return parseFloat(rd.total_duration_s)/60/rd.cycles;
              return 0;
            };
            var rdBuh = function(rd){ return hasN(rd.buh) ? parseFloat(rd.buh) : (hasN(rd.buh_count) ? parseFloat(rd.buh_count) : 0); };
            var rdDefrost = function(rd){ return hasN(rd.defrost) ? parseFloat(rd.defrost) : (hasN(rd.defrost_count) ? parseFloat(rd.defrost_count) : 0); };

            var byDate = {};
            for(var ri=0; ri<rawDays.length; ri++){
              var rd = rawDays[ri];
              if(!rd.day) continue;
              if(!byDate[rd.day]){
                byDate[rd.day] = {day: rd.day, cycles:0, dur_total_min:0, dur_max_min:0, quality_sum:0, quality_weight:0, buh:0, defrost:0, transient:0,
                  modes: {heating:{cycles:0,dur_total_min:0,dur_max_min:0,dt:null,rps:null,quality:null,buh:0,defrost:0},
                          dhw:{cycles:0,dur_total_min:0,dur_max_min:0,dt:null,rps:null,quality:null,buh:0,defrost:0},
                          cooling:{cycles:0,dur_total_min:0,dur_max_min:0,dt:null,rps:null,quality:null,buh:0,defrost:0}}};
              }
              var e = byDate[rd.day];
              var cycN = rd.cycles || 0;
              var dMin = rdDurMin(rd), dMax = rdDurMax(rd), buhV = rdBuh(rd), defrV = rdDefrost(rd);
              var qaV = hasN(rd.quality_avg) ? parseFloat(rd.quality_avg) : null;
              var dtV = hasN(rd.dt_max_avg) ? parseFloat(rd.dt_max_avg) : null;
              var rpsV = hasN(rd.rps_avg) ? parseFloat(rd.rps_avg) : null;
              e.cycles += cycN; e.dur_total_min += dMin;
              if (dMax > e.dur_max_min) e.dur_max_min = dMax;
              e.buh += buhV; e.defrost += defrV; e.transient += (rd.transient_count||0);
              if (qaV !== null) { e.quality_sum += qaV*Math.max(1,cycN); e.quality_weight += Math.max(1,cycN); }
              var mkey = rd.mode || 'unknown';
              if(e.modes[mkey]){
                var mm = e.modes[mkey];
                mm.cycles += cycN; mm.dur_total_min += dMin;
