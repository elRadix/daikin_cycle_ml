                  {t:'kv', k:t('r_maxdur'), v:fmtMin(dS.dur_max_min), c:TH.text},
                  {t:'kv', k:t('r_totaldur'), v:fmtMin(dS.dur_total_min), c:TH.text},
                  {t:'sep'},
                  {t:'kv', k:t('r_buh'), v:String(dS.buh||0), c:(dS.buh>0?TH.buh:TH.sub)},
                  {t:'kv', k:t('r_defrost'), v:String(dS.defrost||0), c:(dS.defrost>0?TH.defrost:TH.sub)}
                ];
                var pattr = popAttr({title: weekday(dS.day)+' '+fmtDay(dS.day), items: items, modes: buildModeChips(dS)});
                s += '<g '+pattr+' style="cursor:pointer;">';
