                s += T(dPadL-6, yy+4, yv, {a:'end'});
              }
              for(var di=0; di<4; di++){
                var o = dist[di];
                var cx = dPadL + di*dSlotW + dSlotW/2;
                var bH = (o.n/distMax)*dPlotH;
                var byTop = dPadT + dPlotH - bH;
                var isDom = (di === domIdx && o.n > 0);
                var dayList = Object.keys(o.days).sort();
                var sharePct = totCycles > 0 ? Math.round(o.n/totCycles*100) : 0;
                var items = [
                  {t:'hl', k:t('r_cycles'), v:String(o.n), c:o.col},
