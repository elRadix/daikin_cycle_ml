              s += '<linearGradient id="'+gid('ps-too')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+TH.red+'" stop-opacity="0.08"/><stop offset="100%" stop-color="'+TH.red+'" stop-opacity="0.20"/></linearGradient>';
              s += '<filter id="'+gid('ps-glow')+'" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
              s += '</defs>';
              var qx = scX(xHalf), qyG = scY(60), qyS = scY(20);
              s += '<rect x="'+scPadL+'" y="'+qyS+'" width="'+(qx-scPadL)+'" height="'+(scPadT+scPlotH-qyS)+'" fill="url(#'+gid('ps-pen')+')"/>';
              s += '<rect x="'+scPadL+'" y="'+qyG+'" width="'+(qx-scPadL)+'" height="'+(qyS-qyG)+'" fill="url(#'+gid('ps-mix')+')"/>';
              s += '<rect x="'+qx+'" y="'+scPadT+'" width="'+(scPadL+scPlotW-qx)+'" height="'+(qyG-scPadT)+'" fill="url(#'+gid('ps-ide')+')"/>';
              s += '<rect x="'+qx+'" y="'+qyS+'" width="'+(scPadL+scPlotW-qx)+'" height="'+(scPadT+scPlotH-qyS)+'" fill="url(#'+gid('ps-too')+')"/>';
              for(var gy=0; gy<=4; gy++){
                var gyv = scYMax*gy/4, gyy = scY(gyv);
                s += '<line x1="'+scPadL+'" y1="'+gyy+'" x2="'+(scPadL+scPlotW)+'" y2="'+gyy+'" stroke="'+TH.grid+'" stroke-width="1"/>';
                s += T(scPadL-8, gyy+4, Math.round(gyv)+'m', {a:'end'});
              }
              for(var gx=0; gx<=4; gx++){
