                }
                return null;
              };
              var s = '<defs>';
              s += '<linearGradient id="'+gid('ps-pen')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+TH.red+'" stop-opacity="0.14"/><stop offset="100%" stop-color="'+TH.red+'" stop-opacity="0.24"/></linearGradient>';
