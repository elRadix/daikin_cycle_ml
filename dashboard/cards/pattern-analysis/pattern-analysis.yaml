                s += '<text x="'+(cx2+6)+'" y="'+(cy2+14)+'" font-size="10">'+MODE_ICON[mk]+'</text>';
                s += T(cx2+22, cy2+13, mk.toUpperCase().slice(0,4), {s:7, w:900, f:TH.sub});
                if (hasN(mc.day) && hasN(mc.month) && mc.month !== 0) {
                  var trdPct = ((mc.day - mc.month) / mc.month * 100);
                  var trdCol = trdPct > 2 ? TH.green : trdPct < -2 ? TH.red : TH.sub;
