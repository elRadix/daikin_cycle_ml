                    s += '<circle cx="'+hX[pv2].toFixed(1)+'" cy="'+hy(vals[pv2]).toFixed(1)+'" r="3" fill="'+MODE_COL[mk]+'" stroke="'+TH.bg+'" stroke-width="1.5"/>';
                    s += '</g>';
                  }
                });
                s += T(hX[0], tY+tH-2, (LANG==='nl'?'dag':'day'), {a:'middle', s:7, w:800, f:TH.sub});
                s += T(hX[1], tY+tH-2, (LANG==='nl'?'week':'week'), {a:'middle', s:7, w:800, f:TH.sub});
                s += T(hX[2], tY+tH-2, (LANG==='nl'?'maand':'month'), {a:'middle', s:7, w:800, f:TH.sub});
              } else {
                s += T(W/2, tY+tH/2, t('no_cop_data'), {a:'middle', s:9, w:900, f:TH.sub});
              }

              /* ROW 3: Mode cards */
              var mY = 122, cardH = 48;
              ['heating','dhw','cooling'].forEach(function(mk, i){
                var mc = modeData[mk];
                var cx2 = P + (i%2) * (CW + P);
                var cy2 = mY + Math.floor(i/2) * (cardH + 4);
