                }
                s += T(cx2+6, cy2+34, fmt1(mc.day), {s:16, w:900, f:(hasN(mc.day)?MODE_COL[mk]:TH.sub), halo:1});
                if (hasN(mc.day) && hasN(mc.week) && hasN(mc.month)) {
                  var msX = cx2 + CW*0.45, msY = cy2 + 20, msW = CW*0.5, msH = 16;
                  var msVals = [mc.month, mc.week, mc.day];
                  var msMin = Math.min.apply(null, msVals), msMax = Math.max.apply(null, msVals);
                  var msRng = Math.max(0.05, msMax - msMin);
                  var msPath = '';
                  for (var mi2=0; mi2<3; mi2++) {
                    var mx = msX + (mi2/2)*msW;
                    var my = msY + msH - ((msVals[mi2]-msMin)/msRng)*msH;
