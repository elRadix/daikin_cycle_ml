                + 'font-size:20px;line-height:1;flex-shrink:0;box-shadow:0 4px 10px rgba(0,151,224,0.3);">' + icon + '</div>'
                + '<div style="min-width:0;flex:1;">'
                + '<div style="font-size:1.05em;font-weight:900;color:' + P.text + ';text-transform:uppercase;letter-spacing:0.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'
                + T3(title) + (model ? ' · ' + model : '') + '</div>'
                + '<div style="font-size:0.82em;font-weight:800;color:' + P.text2 + ';white-space:normal;">' + T3(sub) + (meta ? ' · ' + meta : '') + '</div>'
                + '</div></div>';
            };
            return { lang: lang, dark: dark, P: P, paint: paint, header: header, T3: T3, V: V, model: model,
                     showHelp: V.show_help !== false && V.show_hints !== false };
          })();
          /* DCM-COMMON-END */
          return DCM.paint((function () {
          var _DEC = (function(){ try { var _lc = (typeof hass !== 'undefined' && hass && hass.locale) ? hass.locale : {}; var _nf = _lc.number_format; if (_nf === 'comma_decimal' || _nf === 'none') return '.'; if (_nf === 'decimal_comma' || _nf === 'space_comma') return ','; var _l = String(_lc.language || (typeof hass !== 'undefined' && hass && hass.language) || 'en'); return (1.5).toLocaleString(_l).indexOf(',') >= 0 ? ',' : '.'; } catch (e) { return '.'; } })(); /* #427: decimal separator from the HA number format */
          try {
            /* ═══ 1. CONFIG & LANGUAGE ═══ */
            var CFG = (typeof variables !== 'undefined' && variables) ? variables : {};
            var cfgLangOvr = String(CFG.lang_override || '').toLowerCase();
            var _views = ['advice', 'buckets', 'analysis', 'live'];
            /* the card re-renders on every state change (triggers_update: all):
               keep the tab the user picked instead of default_tab */
            var defaultTab = (_views.indexOf(window.__lwtView) >= 0) ? window.__lwtView
              : (_views.indexOf(CFG.default_tab) >= 0 ? CFG.default_tab : 'advice');
            var showHelp = DCM.showHelp;
            
            var haLang = (typeof hass !== 'undefined' && hass && hass.language) ? String(hass.language).toLowerCase() : '';
            var _cl = '';
            try { for (var _k in states) { if (states[_k] && states[_k].attributes && states[_k].attributes.configured_language && (_k.endsWith('_cycle_state') || _k.endsWith('_cyclus_status') || _k.endsWith('_etat_du_cycle'))) { _cl = String(states[_k].attributes.configured_language).toLowerCase(); break; } } } catch(e) {}
            var LANG = DCM.lang; /* #427: shared language rule */

            /* ═══ 2. ENTITY REGISTRY ═══ */
            var REGISTRY = {
              hp_specs: ['hp_specs', 'wp_specs', 'caracteristiques_de_la_pac'],
              cycle_state: ['cycle_state', 'cyclus_status', 'etat_du_cycle'],
              lwt_advice: ['heating_curve_advice', 'stooklijn_advies', 'conseil_de_loi_d_eau']
