              + '.pa-popup-mode-d{color:#546E7A;}'
              + '.pa-popup-mode-q{font-weight:900;}'
              + '.pa-popup-bar{height:3px;background:#0097E0;width:100%;transform-origin:left center;animation:pa-popBar 4s linear forwards;}'
              + '</style>';

            var r = '<div class="pa-chart" data-tab="'+activeTab+'" data-win="'+activeWin+'" style="width:100%;box-sizing:border-box;position:relative;">';
            r += css;
            r += tabBar;
            r += actions;
            r += buildView(7);
            r += buildView(15);
            r += buildView(30);
            r += '<div class="pa-popup-host"></div>';
            r += '<div style="height:4px;"></div>';
            r += '</div>';
            return r;

          } catch(e) {
            return '<div style="padding:16px;color:#C62828;font-family:monospace;font-weight:800;font-size:0.85em;">⚠️ Summary error: ' + (e && e.message ? e.message : e) + '</div>';
          }
        ]]]
