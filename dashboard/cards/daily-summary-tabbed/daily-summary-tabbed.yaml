# ============================================================
# Daikin Cycle ML — Daily Summary Tabbed Card
# ============================================================
#
# Optional variables (add at top, before type:):
#   variables:
#     lang_override: ''         # '' = auto | 'nl' | 'en'
#     default_tab: 'overview'   # overview | quality | cycles | duration | events
#     default_window: 7         # 7 | 15 | 30
#     chart_height: 280         # pixels
#     show_hints: true          # false = hide hint notes
#
# Requires HACS frontend cards:
#   stack-in-card, mushroom-template-card, button-card, card-mod
# ============================================================

type: custom:stack-in-card
variables:
  lang_override: ''
  default_tab: 'overview'
  default_window: 7
  chart_height: 280
  show_hints: true
card_mod:
  style: |
    ha-card {
      border: 3px solid #0097E0;
      border-radius: 16px;
      background: linear-gradient(180deg, #F5FAFD 0%, #E6F4FB 50%, #D6ECF7 100%);
      box-shadow: 0 8px 24px rgba(0, 151, 224, 0.25);
      overflow: visible;
    }
cards:
  - type: custom:mushroom-template-card
    primary: >-
      📅 DAIKIN CYCLE ML — SUMMARY{% set ns = namespace(specs='') %}{% for s in states.sensor %}{% if ns.specs == '' and (s.entity_id.endswith('_hp_specs') or s.entity_id.endswith('_wp_specs')) %}{% set ns.specs = s.entity_id %}{% endif %}{% endfor %}{{ ' · ' + (state_attr(ns.specs, 'model')|string|upper) if ns.specs and state_attr(ns.specs, 'model') else '' }}
    secondary: >-
      {% set ns = namespace(specs='', state='') %}{% for s in states.sensor %}{% if ns.specs == '' and (s.entity_id.endswith('_hp_specs') or s.entity_id.endswith('_wp_specs')) %}{% set ns.specs = s.entity_id %}{% endif %}{% if ns.state == '' and (s.entity_id.endswith('_cycle_state') or s.entity_id.endswith('_cyclus_status')) %}{% set ns.state = s.entity_id %}{% endif %}{% endfor %}{% set l = 'nl' if hass.language and hass.language.startswith('nl') else ('en' if hass.language and hass.language.startswith('en') else (state_attr(ns.state, 'configured_language') or 'en')) -%}{% set f = state_attr(ns.specs, 'family') or '—' -%}{% set k = state_attr(ns.specs, 'kw') or '—' -%}{{ f }} · {{ k }} kW · {% if l == 'nl' %}Cycli · duur · kwaliteit · events{% else %}Cycles · duration · quality · events{% endif %}
    icon: mdi:calendar-range
    icon_color: blue
    multiline_secondary: true
    card_mod:
      style: >
        ha-card { background: linear-gradient(135deg,#E3F2FD 0%,#BBDEFB 100%)
        !important; box-shadow: none; border-bottom: 3px solid #0097E0;
        border-radius: 0; padding: 12px 16px; } .primary { color: #0D47A1
        !important; font-weight: 900 !important; font-size: 1.1em !important;
        text-transform: uppercase; letter-spacing: 0.8px; } .secondary { color:
        #1565C0 !important; font-size: 0.92em !important; font-weight: 800
        !important; }
  - type: custom:button-card
    show_name: false
    show_icon: false
    triggers_update: all
    tap_action:
      action: javascript
      javascript: |
        [[[
          try {
            const card = this;
            const root = card.shadowRoot || card.getRootNode?.() || card;
            const chart = root.querySelector('.pa-chart');
            if (!chart) return;
            const existingPopup = chart.querySelector('.pa-popup');
            if (existingPopup) {
              const hovered = Array.from(root.querySelectorAll(':hover, :active'));
              for (const h of hovered) {
                if (h.closest && h.closest('.pa-popup')) {
                  if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                  existingPopup.classList.add('pa-popup-out');
                  setTimeout(() => { if (existingPopup.parentNode) existingPopup.parentNode.removeChild(existingPopup); }, 200);
                  return;
                }
              }
            }
            let candidates = Array.from(root.querySelectorAll(':hover, :active')).reverse();
            if (!candidates.length) candidates = Array.from(root.querySelectorAll('[data-pa-action]')).reverse();
            for (const el of candidates) {
              if (!el || !el.dataset) continue;
              const action = el.dataset.paAction;
              if (!action) continue;
              if (action === 'tab') {
                card.__paState = card.__paState || {};
                card.__paState.tab = el.dataset.paArg;
                if (card.update) card.update();
                return;
              }
              if (action === 'win') {
                card.__paState = card.__paState || {};
                card.__paState.win = parseInt(el.dataset.paArg, 10);
                if (card.update) card.update();
                return;
              }
              if (action === 'detail') {
                if (window.__paShowPopup) window.__paShowPopup(el, card);
                return;
              }
              if (action === 'close-popup') {
                const popup = el.closest('.pa-popup') || el;
                if (popup && popup.parentNode) {
                  if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                  popup.classList.add('pa-popup-out');
                  setTimeout(() => { if (popup.parentNode) popup.parentNode.removeChild(popup); }, 200);
                }
                return;
              }
            }
          } catch(e) { console.warn('[PA]', e); }
        ]]]
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - padding: 6px 6px 2px 6px
        - overflow: visible
      grid:
        - grid-template-areas: '"content"'
        - grid-template-columns: 1fr
      custom_fields:
        content:
          - width: 100%
          - pointer-events: auto
    custom_fields:
      content: |
        [[[
          try {
            var card = this;
            card.__paRegistry = card.__paRegistry || {};
            card.__paSeq = 0;

            var CFG = (typeof variables !== 'undefined' && variables) ? variables : {};
            var cfgTab = String(CFG.default_tab || 'overview');
            var cfgWin = parseInt(CFG.default_window, 10) || 7;
            var cfgChartH = parseInt(CFG.chart_height, 10) || 280;
            var cfgShowHints = CFG.show_hints !== false;
            var cfgLangOvr = String(CFG.lang_override || '').toLowerCase();

            var REGISTRY = {
              daily_summary:       ['daily_summary_recent','recent_dagoverzicht'],
              hp_specs:            ['hp_specs','wp_specs'],
              cycle_state:         ['cycle_state','cyclus_status'],
              current_cycle:       ['current_cycle','huidige_cyclus'],
              last_cycle:          ['last_cycle','laatste_cyclus'],
              starts_today:        ['compressor_starts_today','compressorstarts_vandaag'],
              runtime_buh:         ['runtime_buh_today','buh_bedrijfstijd_vandaag'],
              runtime_compressor:  ['runtime_compressor_today','compressorbedrijfstijd_vandaag'],
              defrost_count:       ['defrost_count_today','ontdooiingen_vandaag'],
              defrost_duration:    ['defrost_duration_today','ontdooiingsduur_vandaag'],
              duty_cycle:          ['duty_cycle_today','duty_cycle_vandaag'],
              cop_today:           ['cop_today','cop_vandaag'],
              cycles_today:        ['cycles_today','cycli_vandaag'],
              source_health:       ['source_health','bron_gezondheid'],
              quality_today:       ['quality_today','kwaliteit_vandaag']
            };
            var resolveEntity = function(role){
              var names = REGISTRY[role];
              if(!names) return null;
              var all = Object.keys(states).filter(function(e){ return e.indexOf('sensor.') === 0; });
              var preferred = all.filter(function(e){ return e.indexOf('daikin_cycle_ml') !== -1; });
              var i, j;
              for(i=0; i<names.length; i++){
                for(j=0; j<preferred.length; j++){
                  if(preferred[j].slice(-1 - names[i].length) === '_' + names[i]) return preferred[j];
                }
              }
              for(i=0; i<names.length; i++){
                for(j=0; j<all.length; j++){
                  if(all[j].slice(-1 - names[i].length) === '_' + names[i]) return all[j];
                }
              }
              return null;
            };

            var SUMMARY = resolveEntity('daily_summary');
            var SPECS   = resolveEntity('hp_specs');
            var STATE   = resolveEntity('cycle_state');

            if (!SUMMARY || !STATE) {
              return '<div style="padding:16px;color:#C62828;font-family:monospace;font-weight:800;font-size:0.85em;">'
                + '⚠️ Daikin Cycle ML entities niet gevonden. Controleer of de integratie draait.<br>'
                + 'Gezocht: sensor.*_daily_summary_recent / *_recent_dagoverzicht + *cycle_state / *cyclus_status<br>'
                + 'Gevonden sensors met daikin_cycle_ml: '
                + Object.keys(states).filter(function(e){ return e.indexOf('daikin_cycle_ml')!==-1 && e.indexOf('sensor.')===0; }).length
                + '</div>';
            }

            var hasV = function(v){ return v!==null && v!==undefined && v!=='' && String(v)!=='None' && String(v)!=='unknown' && String(v)!=='unavailable'; };
            var v1 = function(v){ if(!hasV(v)||isNaN(parseFloat(v))||!isFinite(parseFloat(v)))return '—'; return Number(v).toFixed(1).replace('.',','); };
            var vI = function(v){ if(!hasV(v)||isNaN(parseFloat(v)))return '—'; return Math.round(parseFloat(v)).toString(); };
            var attr = function(id,n,d){ try{ if(!id)return d; var a=states[id] && states[id].attributes; if(!a)return d; var v=a[n]; if(v===undefined||v===null||String(v)==='None')return d; return v; } catch(e){ return d; } };
            var aN = function(id,n,d){ var v=attr(id,n,null); if(v===null)return d; var x=parseFloat(v); return isNaN(x)?d:x; };
            var weekday = function(iso){ if(!iso) return ''; try{ var d = new Date(iso + 'T12:00:00'); return ['zo','ma','di','wo','do','vr','za'][d.getDay()]; }catch(e){ return ''; } };
            var weekdayEn = function(iso){ if(!iso) return ''; try{ var d = new Date(iso + 'T12:00:00'); return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]; }catch(e){ return ''; } };
            var fmtDay = function(iso){ if(!iso) return '—'; var p=String(iso).split('-'); return p.length>=3 ? p[2]+'/'+p[1] : iso; };
            var fmtBigMin = function(m){
              if(!hasV(m)) return '—'; var n = Number(m);
              if(n >= 1440) return Math.round(n/1440)+'d';
              if(n >= 120) return Math.round(n/60)+'h';
              if(n >= 60) return (n/60).toFixed(1).replace('.',',')+'h';
              return Math.round(n)+'m';
            };
            var fmtBigHours = function(h){
              if(!hasV(h)) return '—'; var n = Number(h);
              if(n >= 24*7) return Math.round(n/24)+'d';
              if(n >= 24) return Math.round(n)+'h';
              if(n >= 10) return n.toFixed(0)+'h';
              if(n >= 1) return n.toFixed(1).replace('.',',')+'h';
              return Math.round(n*60)+'m';
            };
            var fmtSec = function(s){
              if (!isFinite(s) || s <= 0) return '0m';
              if (s < 60) return Math.round(s)+'s';
              var m = Math.round(s/60);
              if (m < 60) return m+'m';
              return (m/60).toFixed(1).replace('.',',')+'h';
            };
            var qColor = function(q){ return q===null||q===undefined?'#546E7A':(q>=70?'#2E7D32':q>=40?'#E65100':'#C62828'); };
            var TXT_HALO = 'paint-order="stroke fill" stroke="white" stroke-width="2.5" stroke-opacity="0.9" stroke-linejoin="round"';

            var C = { heating:'#E63946', dhw:'#4FC3F7', cooling:'#0D47A1', buh:'#E65100', defrost:'#1976D2', quality:'#2E7D32', gem:'#6A1B9A', total:'#546E7A' };
            var CBG = { heating:'#FFEBEE', dhw:'#E1F5FE', cooling:'#E3F2FD', buh:'#FFF3E0', defrost:'#E3F2FD', quality:'#E8F5E9', gem:'#F3E5F5', total:'#ECEFF1' };
            var QGOOD='#2E7D32', QMID='#E65100', QLOW='#C62828';

            var haLang = (typeof hass !== 'undefined' && hass && hass.language)
              ? String(hass.language).toLowerCase() : '';
            var cfgLang = String(attr(STATE,'configured_language','en')).toLowerCase();
            var LANG = 'en';
            if (cfgLangOvr === 'nl' || cfgLangOvr === 'en') { LANG = cfgLangOvr; }
            else if (haLang.indexOf('nl') === 0) { LANG = 'nl'; }
            else if (cfgLang === 'nl') { LANG = 'nl'; }

            var I18N = {
              tab_overview:{nl:'📊 OVERZICHT', en:'📊 OVERVIEW'},
              tab_quality: {nl:'⭐ KWALITEIT', en:'⭐ QUALITY'},
              tab_cycles:  {nl:'🔄 CYCLI',     en:'🔄 CYCLES'},
              tab_duration:{nl:'⏱️ DUUR',      en:'⏱️ DURATION'},
              tab_events:  {nl:'⚡ EVENTS',    en:'⚡ EVENTS'},
              best:  {nl:'Beste dag', en:'Best day'},
              worst: {nl:'Slechtste dag', en:'Worst day'},
              qual_chart:  {nl:'Kwaliteit per dag', en:'Quality per day'},
              cycles_chart:{nl:'Cycli per dag', en:'Cycles per day'},
              dur_chart:   {nl:'Duur per dag', en:'Duration per day'},
              ev_chart:    {nl:'Event counts per dag', en:'Event counts per day'},
              ev_ratio:    {nl:'Event-ratio per dag', en:'Event ratio per day'},
              q_good: {nl:'≥70 goed', en:'≥70 good'},
              q_mid:  {nl:'40-70 midden', en:'40-70 mid'},
              q_low:  {nl:'<40 laag', en:'<40 low'},
              leg_heat: {nl:'Verwarming', en:'Heating'},
              leg_dhw:  {nl:'DHW', en:'DHW'},
              leg_cool: {nl:'Koeling', en:'Cooling'},
              leg_buh:  {nl:'BUH', en:'BUH'},
              leg_defr: {nl:'Defrost', en:'Defrost'},
              no_data:  {nl:'Geen data', en:'No data'},
              n_overview:{nl:'💡 Tik op een element voor details', en:'💡 Tap an item for details'},
              n_quality: {nl:'💡 Tik op een punt of stat voor dag-details', en:'💡 Tap a dot or stat for day details'},
              n_cycles:  {nl:'💡 Cyclus = continue compressor-run · <15m = inefficiënt pendelen · >4u = MAX_CYCLE_CAP', en:'💡 Cycle = continuous compressor run · <15m = inefficient cycling · >4u = MAX_CYCLE_CAP'},
              n_duration:{nl:'💡 Duur = totale compressor-runtime per dag · splits per modus · ⚠ = geclipt', en:'💡 Duration = total compressor runtime per day · split per mode · ⚠ = clipped'},
              n_events:  {nl:'💡 Ratio = events per cyclus × 100 · groen = nominaal (15%) · rood = verhoogd (35%)', en:'💡 Ratio = events per cycle × 100 · green = nominal (15%) · red = elevated (35%)'},
              r_quality: {nl:'Kwaliteit', en:'Quality'},
              r_cycles:  {nl:'Cycli', en:'Cycles'},
              r_avgdur:  {nl:'Ø duur', en:'Ø duration'},
              r_avgdur2: {nl:'Gem duur', en:'Avg duration'},
              r_maxdur:  {nl:'Langste', en:'Longest'},
              r_totaldur:{nl:'Totale duur', en:'Total runtime'},
              r_buh:     {nl:'⚡ BUH', en:'⚡ BUH'},
              r_defrost: {nl:'❄ Defrost', en:'❄ Defrost'},
              r_avgq:    {nl:'Gem kwaliteit', en:'Avg quality'},
              r_total:   {nl:'Totaal', en:'Total'},
              r_sum:     {nl:'Som', en:'Sum'},
              r_avgday:  {nl:'Gem/dag', en:'Avg/day'},
              r_maxday:  {nl:'Max dag', en:'Max day'},
              r_avgcyc:  {nl:'Ø/cyclus', en:'Ø/cycle'},
              r_cap:     {nl:'Cap', en:'Cap'},
              r_starts:  {nl:'Starts vandaag', en:'Starts today'},
              r_days_good:{nl:'Goede dagen', en:'Good days'},
              r_days_mid:{nl:'Midden dagen', en:'Mid days'},
              r_days_low:{nl:'Slechte dagen', en:'Low days'},
              r_totalbuh:{nl:'Tot BUH', en:'Total BUH'},
              r_totaldef:{nl:'Tot defrost', en:'Total defrost'},
              r_avgratio:{nl:'Gem ratio', en:'Avg ratio'},
              r_lastdef: {nl:'Laatste defrost', en:'Last defrost'},
              r_duty:    {nl:'Duty', en:'Duty'},
              r_range:   {nl:'Periode', en:'Range'},
              r_worst:   {nl:'Slechtste dag', en:'Worst day'},
              r_best:    {nl:'Beste dag', en:'Best day'},
              r_mode:    {nl:'Modus', en:'Mode'},
              r_n_days:  {nl:'Dagen', en:'Days'},
              r_span:    {nl:'Tijdsduur', en:'Span'},
              p_modes:   {nl:'MODI', en:'MODES'},
              p_step:    {nl:'Step', en:'Step'},
              p_energy:  {nl:'Energie', en:'Energy'},
              p_band:    {nl:'Band', en:'Band'},
              p_runtime: {nl:'Runtime', en:'Runtime'},
              p_elapsed: {nl:'Verstreken', en:'Elapsed'}
            };
            var t = function(k){ var e=I18N[k]; if(!e) return k; return e[LANG] || e.en || e.nl; };
            var wd = function(iso){ return LANG==='nl' ? weekday(iso) : weekdayEn(iso); };

            /* POPUP SYSTEM */
            if (!window.__paShowPopup) {
              window.__paShowPopup = function(el, cardEl){
                try {
                  var chart = el.closest('.pa-chart');
                  if (!chart) return;
                  var host = chart.querySelector('.pa-popup-host');
                  if (!host) return;
                  var pid = el.getAttribute('data-pa-pid');
                  if (!pid) return;
                  var registry = cardEl.__paRegistry || {};
                  var payload = registry[pid];
                  if (!payload) return;

                  var now = Date.now();
                  if (chart.__paLastTap && (now - chart.__paLastTap) < 200) return;
                  chart.__paLastTap = now;

                  var oldPops = host.querySelectorAll('.pa-popup');
                  for (var i = 0; i < oldPops.length; i++) if (oldPops[i].parentNode) oldPops[i].parentNode.removeChild(oldPops[i]);
                  if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }

                  var pop = document.createElement('div');
                  pop.className = 'pa-popup';
                  pop.setAttribute('data-pa-action','close-popup');
                  var html = '<div class="pa-popup-hd"><span class="pa-popup-ttl">' + payload.title + '</span><span class="pa-popup-x">✕</span></div>';
                  if (payload.items && payload.items.length) {
                    for (var j = 0; j < payload.items.length; j++) {
                      var it = payload.items[j];
                      if (it.hl) {
                        html += '<div class="pa-popup-hl"><span class="pa-popup-hl-k">' + it.k + '</span><span class="pa-popup-hl-v" style="color:' + (it.c || '#1976D2') + '">' + it.v + '</span></div>';
                      } else {
                        html += '<div class="pa-popup-row"><span class="pa-popup-k">' + it.k + '</span><span class="pa-popup-v" style="color:' + (it.c || '#0D47A1') + '">' + it.v + '</span></div>';
                      }
                    }
                  }
                  if (payload.modes && payload.modes.length) {
                    html += '<div class="pa-popup-sep"></div><div class="pa-popup-mhdr">' + (LANG==='nl'?'MODI':'MODES') + '</div><div class="pa-popup-modes">';
                    for (var mi = 0; mi < payload.modes.length; mi++) {
                      var md = payload.modes[mi];
                      var qStr = (md.q === null || md.q === undefined) ? '—' : md.q;
                      html += '<div class="pa-popup-mode">'
                        + '<span class="pa-popup-mode-ic">' + md.icon + '</span>'
                        + '<span class="pa-popup-mode-c">' + md.cycles + '×</span>'
                        + '<span class="pa-popup-mode-d">' + md.dur + '</span>'
                        + '<span class="pa-popup-mode-q" style="color:' + (md.qc || '#546E7A') + '">Q' + qStr + '</span>'
                        + '</div>';
                    }
                    html += '</div>';
                  }
                  html += '<div class="pa-popup-bar"></div>';
                  pop.innerHTML = html;

                  pop.style.visibility = 'hidden';
                  host.appendChild(pop);

                  var chartRect = chart.getBoundingClientRect();
                  var rect; try { rect = el.getBoundingClientRect(); } catch(e){ rect = null; }
                  var pw = pop.offsetWidth || 260, ph = pop.offsetHeight || 200;
                  var ex = 0, ey = 40, ew = 100, eh = 20;
                  if (rect && rect.width > 0) { ex = rect.left - chartRect.left; ey = rect.top - chartRect.top; ew = rect.width; eh = rect.height; }
                  else { ex = chartRect.width / 2 - 60; }
                  var GAP = 12, MARGIN = 8;
                  var left = ex + ew/2 - pw/2;
                  if (left < MARGIN) left = MARGIN;
                  if (left + pw > chartRect.width - MARGIN) left = chartRect.width - pw - MARGIN;
                  var placeAbove = (ey - GAP - ph) >= MARGIN;
                  var top;
                  if (placeAbove) {
                    top = ey - GAP - ph;
                    pop.classList.add('popup-above');
                  } else {
                    var belowTop = ey + eh + GAP;
                    if (belowTop + ph <= chartRect.height - MARGIN) {
                      top = belowTop;
                      pop.classList.add('popup-below');
                    } else {
                      top = Math.max(MARGIN, ey - GAP - ph);
                      pop.classList.add('popup-clamped');
                    }
                  }
                  pop.style.left = left + 'px';
                  pop.style.top = top + 'px';
                  pop.style.visibility = 'visible';

                  pop.addEventListener('click', function(ev){
                    ev.stopImmediatePropagation(); ev.stopPropagation(); ev.preventDefault();
                    if (chart.__paTimer) { clearTimeout(chart.__paTimer); chart.__paTimer = null; }
                    pop.classList.add('pa-popup-out');
                    setTimeout(function(){ if (pop.parentNode) pop.parentNode.removeChild(pop); }, 220);
                  }, true);
                  chart.__paTimer = setTimeout(function(){
                    if (pop && pop.parentNode) { pop.classList.add('pa-popup-out'); setTimeout(function(){ if (pop.parentNode) pop.parentNode.removeChild(pop); }, 250); }
                    chart.__paTimer = null;
                  }, 4000);
                } catch(e){ console.warn('[PA popup]', e); }
              };
            }

            var rawDays = attr(SUMMARY, 'days', []);
            if(!Array.isArray(rawDays)) rawDays = [];
            var specModel = attr(SPECS, 'model', null);
            var specFamily = attr(SPECS, 'family', null);
            var specKw = aN(SPECS, 'kw', null);
            var specConfigured = attr(SPECS, 'configured', false);

            var byDate = {};
            for(var ri = 0; ri < rawDays.length; ri++){
              var rd = rawDays[ri];
              var dayKey = rd.day;
              if(!dayKey) continue;
              if(!byDate[dayKey]){
                byDate[dayKey] = {
                  day: dayKey, cycles:0, dur_min:0, dur_max:0,
                  quality_sum:0, quality_weight:0, buh:0, defrost:0,
                  modes:{
                    heating:{cycles:0,dur:0,quality:null},
                    dhw:{cycles:0,dur:0,quality:null},
                    cooling:{cycles:0,dur:0,quality:null}
                  }
                };
              }
              var de = byDate[dayKey];
              de.cycles += (rd.cycles || 0);
              de.dur_min += (rd.dur_min || 0);
              if(hasV(rd.dur_max) && parseFloat(rd.dur_max) > de.dur_max) de.dur_max = parseFloat(rd.dur_max);
              if(hasV(rd.quality_avg)){
                var qVal = parseFloat(rd.quality_avg);
                if(isFinite(qVal)){
                  var w = Math.max(1, rd.cycles || 0);
                  de.quality_sum += qVal * w;
                  de.quality_weight += w;
                }
              }
              de.buh += (rd.buh || 0);
              de.defrost += (rd.defrost || 0);
              var mkey = rd.mode || 'unknown';
              if(de.modes[mkey]){
                de.modes[mkey].cycles += (rd.cycles || 0);
                de.modes[mkey].dur += (rd.dur_min || 0);
                if (hasV(rd.quality_avg)) {
                  var mq = parseFloat(rd.quality_avg);
                  if (isFinite(mq)) de.modes[mkey].quality = mq;
                }
              }
            }
            var daysAll = Object.keys(byDate).map(function(k){
              var de = byDate[k];
              de.quality_avg = de.quality_weight > 0 ? de.quality_sum / de.quality_weight : null;
              de.dur_avg = de.cycles > 0 ? de.dur_min / de.cycles : 0;
              return de;
            }).sort(function(a,b){ return a.day < b.day ? -1 : 1; });

            var ps = card.__paState = card.__paState || {};
            if (!ps.tab || ['overview','quality','cycles','duration','events'].indexOf(ps.tab) === -1) ps.tab = cfgTab;
            if (!ps.win || [7,15,30].indexOf(ps.win) === -1) ps.win = cfgWin;
            var activeTab = ps.tab;
            var activeWin = String(ps.win);

            var registerPayload = function(payload){
              card.__paSeq++;
              var id = 'p' + card.__paSeq;
              card.__paRegistry[id] = payload;
              return id;
            };

            var buildDayPayload = function(d){
              var items = [
                { k:t('r_quality'), v:(d.quality_avg===null?'—':vI(d.quality_avg)+'%'), c:qColor(d.quality_avg), hl:true },
                { k:t('r_cycles'),   v:String(d.cycles), c:'#0D47A1' },
                { k:t('r_avgdur2'),  v:(d.cycles>0?fmtBigMin(d.dur_min/d.cycles):'—'), c:'#0D47A1' },
                { k:t('r_maxdur'),   v:fmtBigMin(d.dur_max), c:'#0D47A1' },
                { k:t('r_totaldur'), v:fmtBigMin(d.dur_min), c:'#0D47A1' },
                { k:t('r_buh'),      v:String(d.buh||0),     c:(d.buh>0?'#E65100':'#94a3b8') },
                { k:t('r_defrost'),  v:String(d.defrost||0), c:(d.defrost>0?'#1976D2':'#94a3b8') }
              ];
              var modes = [];
              var mmap = { heating:{ic:'🔥', col:C.heating, nm:(LANG==='nl'?'Verwarming':'Heating')},
                           dhw:{ic:'🚿', col:C.dhw, nm:'DHW'},
                           cooling:{ic:'🧊', col:C.cooling, nm:(LANG==='nl'?'Koeling':'Cooling')} };
              Object.keys(d.modes).forEach(function(mk){
                var m = d.modes[mk];
                if (m.cycles > 0) {
                  modes.push({
                    icon: mmap[mk].ic, col: mmap[mk].col, name: mmap[mk].nm,
                    cycles: m.cycles,
                    dur: fmtBigMin(m.dur),
                    q: (m.quality===null||m.quality===undefined) ? '—' : vI(m.quality),
                    qc: qColor(m.quality)
                  });
                }
              });
              return registerPayload({ title: wd(d.day)+' '+fmtDay(d.day), items: items, modes: modes });
            };

            var statStrip = function(items){
              var s = '<div class="pa-stats">';
              for (var i=0;i<items.length;i++){
                var it = items[i];
                var clickable = it.pid ? ' data-pa-action="detail" data-pa-pid="'+it.pid+'" style="cursor:pointer;"' : '';
                s += '<div class="pa-stat"'+clickable+'>'
                  + '<div class="pa-stat-l" style="color:'+(it.c||'#546E7A')+'">'+it.l+'</div>'
                  + '<div class="pa-stat-v" style="color:'+(it.vc||it.c||'#0D47A1')+'">'+it.v+'</div>'
                  + '</div>';
              }
              s += '</div>';
              return s;
            };

            var buildOverview = function(sub, winKey){
              var wTotCycles = sub.reduce(function(a,d){ return a+d.cycles; }, 0);
              var wHours = sub.reduce(function(a,d){ return a+d.dur_min; }, 0) / 60;
              var qVals = sub.filter(function(d){ return d.quality_avg !== null; }).map(function(d){ return d.quality_avg; });
              var wQ = qVals.length > 0 ? qVals.reduce(function(a,v){ return a+v; },0)/qVals.length : null;

              var byQ = sub.filter(function(d){ return d.quality_avg!==null; }).slice().sort(function(a,b){ return b.quality_avg - a.quality_avg; });
              var best = byQ.length > 0 ? byQ[0] : null;
              var worst = byQ.length > 1 ? byQ[byQ.length-1] : null;

              var modeTotals = { heating:0, dhw:0, cooling:0 };
              var modeDurs = { heating:0, dhw:0, cooling:0 };
              sub.forEach(function(d){
                modeTotals.heating += d.modes.heating.cycles;
                modeTotals.dhw += d.modes.dhw.cycles;
                modeTotals.cooling += d.modes.cooling.cycles;
                modeDurs.heating += d.modes.heating.dur;
                modeDurs.dhw += d.modes.dhw.dur;
                modeDurs.cooling += d.modes.cooling.dur;
              });

              var ringR = 46, ringStroke = 10, ringSize = 120;
              var cx = ringSize/2, cy = ringSize/2;
              var circ = 2 * Math.PI * ringR;
              var qPct = wQ===null ? 0 : Math.max(0, Math.min(100, wQ));
              var dashLen = circ * (qPct/100);
              var ringCol = qColor(wQ);

              var ringSvg = '<svg viewBox="0 0 '+ringSize+' '+ringSize+'" style="width:110px;height:110px;display:block;">';
              ringSvg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+ringR+'" fill="none" stroke="rgba(25,118,210,0.10)" stroke-width="'+ringStroke+'"/>';
              ringSvg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+ringR+'" fill="none" stroke="'+ringCol+'" stroke-width="'+ringStroke+'" stroke-linecap="round" stroke-dasharray="'+dashLen.toFixed(1)+' '+circ.toFixed(1)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
              ringSvg += '<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" font-weight="900" fill="'+ringCol+'">'+(wQ===null?'—':vI(wQ)+'%')+'</text>';
              ringSvg += '<text x="'+cx+'" y="'+(cy+18)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="900" fill="#546E7A" letter-spacing="0.4">'+t('r_avgq').toUpperCase()+'</text>';
              ringSvg += '</svg>';

              var modeTotal = modeTotals.heating + modeTotals.dhw + modeTotals.cooling;
              var barHtml = '';
              if (modeTotal > 0) {
                var hPct = (modeTotals.heating/modeTotal)*100;
                var dPct = (modeTotals.dhw/modeTotal)*100;
                var cPct = (modeTotals.cooling/modeTotal)*100;
                barHtml = '<div class="pa-mode-bar">';
                if (modeTotals.heating > 0) barHtml += '<div class="pa-mode-seg" style="width:'+hPct.toFixed(2)+'%;background:'+C.heating+';"><span>'+modeTotals.heating+'</span></div>';
                if (modeTotals.dhw > 0) barHtml += '<div class="pa-mode-seg" style="width:'+dPct.toFixed(2)+'%;background:'+C.dhw+';"><span>'+modeTotals.dhw+'</span></div>';
                if (modeTotals.cooling > 0) barHtml += '<div class="pa-mode-seg" style="width:'+cPct.toFixed(2)+'%;background:'+C.cooling+';"><span>'+modeTotals.cooling+'</span></div>';
                barHtml += '</div>';
                barHtml += '<div class="pa-mode-legend">';
                if (modeTotals.heating > 0) barHtml += '<span><span class="pa-mode-dot" style="background:'+C.heating+'"></span>'+t('leg_heat')+' '+Math.round(hPct)+'%</span>';
                if (modeTotals.dhw > 0) barHtml += '<span><span class="pa-mode-dot" style="background:'+C.dhw+'"></span>'+t('leg_dhw')+' '+Math.round(dPct)+'%</span>';
                if (modeTotals.cooling > 0) barHtml += '<span><span class="pa-mode-dot" style="background:'+C.cooling+'"></span>'+t('leg_cool')+' '+Math.round(cPct)+'%</span>';
                barHtml += '</div>';
              }

              var modelDisplay;
              if (specConfigured && specModel) modelDisplay = specModel.toUpperCase();
              else if (specModel === 'custom' || specModel === 'basisprofiel') modelDisplay = 'CUSTOM';
              else if (specModel) modelDisplay = specModel.toUpperCase();
              else modelDisplay = '—';

              var heroPid = registerPayload({
                title: t('r_range'),
                items: [
                  { k:t('r_n_days'), v:String(sub.length) },
                  { k:t('r_total'),  v:String(wTotCycles), hl:true },
                  { k:t('r_totaldur'), v:fmtBigHours(wHours) },
                  { k:t('r_avgq'),   v:(wQ===null?'—':vI(wQ)+'%'), c:qColor(wQ) },
                  { k:t('r_best'),   v:(best?wd(best.day)+' '+fmtDay(best.day)+' · '+vI(best.quality_avg)+'%':'—'), c:QGOOD },
                  { k:t('r_worst'),  v:(worst?wd(worst.day)+' '+fmtDay(worst.day)+' · '+vI(worst.quality_avg)+'%':'—'), c:QLOW }
                ],
                modes: [
                  { icon:'🔥', col:C.heating, name:t('leg_heat'), cycles:modeTotals.heating, dur:fmtBigMin(modeDurs.heating), q:'—', qc:'#94a3b8' },
                  { icon:'🚿', col:C.dhw,    name:'DHW',          cycles:modeTotals.dhw,    dur:fmtBigMin(modeDurs.dhw),    q:'—', qc:'#94a3b8' },
                  { icon:'🧊', col:C.cooling, name:t('leg_cool'), cycles:modeTotals.cooling, dur:fmtBigMin(modeDurs.cooling), q:'—', qc:'#94a3b8' }
                ]
              });

              var h = '';
              h += '<div class="pa-hero" data-pa-action="detail" data-pa-pid="'+heroPid+'" style="cursor:pointer;">';
              h += '<div class="pa-hero-row">';
              h += '<div class="pa-hero-l">';
              h += '<div class="pa-hero-ic">🌡️</div>';
              h += '<div>';
              h += '<div class="pa-hero-lbl">DAIKIN CYCLE ML</div>';
              h += '<div class="pa-hero-model">'+modelDisplay+'</div>';
              h += '<div class="pa-hero-sub">'+(specFamily||'—')+(specKw?' · '+vI(specKw)+' kW':'')+'</div>';
              h += '</div></div>';
              h += '<div class="pa-hero-ring">'+ringSvg+'</div>';
              h += '</div>';
              h += '<div class="pa-hero-foot">';
              h += '<span class="pa-hero-stat">'+String(wTotCycles)+' cycli · '+fmtBigHours(wHours)+'</span>';
              h += '<span class="pa-hero-dates">'+fmtDay(sub[0].day)+' → '+fmtDay(sub[sub.length-1].day)+'</span>';
              h += '</div>';
              if (barHtml) h += '<div class="pa-hero-split">'+barHtml+'</div>';
              h += '</div>';

              if (best || worst) {
                h += '<div class="pa-bw">';
                var bwCard = function(icon, lbl, d, col){
                  if (!d) return '<div class="pa-bw-card pa-empty-card">—</div>';
                  var qc = qColor(d.quality_avg);
                  var pid = buildDayPayload(d);
                  return '<div class="pa-bw-card" data-pa-action="detail" data-pa-pid="'+pid+'" style="border-color:'+col+'">'
                    + '<div class="pa-bw-lbl" style="color:'+col+'">'+icon+' '+lbl+'</div>'
                    + '<div class="pa-bw-date">'+wd(d.day)+' '+fmtDay(d.day)+'</div>'
                    + '<div class="pa-bw-row"><span class="pa-bw-q" style="color:'+qc+'">'+(d.quality_avg===null?'—':vI(d.quality_avg)+'%')+'</span>'
                    + '<span class="pa-bw-meta">'+d.cycles+'c · '+fmtBigMin(d.dur_min)+'</span></div>'
                    + '</div>';
                };
                h += bwCard('🏆', t('best'), best, QGOOD);
                h += bwCard('⚠️', t('worst'), worst, QLOW);
                h += '</div>';
              }

              h += '<div class="pa-block">';
              h += '<div class="pa-block-hdr"><span>📈 '+(LANG==='nl'?'Trends':'Trends')+'</span><span>'+sub.length+'d</span></div>';
              h += buildSpark(sub);
              h += '</div>';
              return h;
            };

            var buildSpark = function(sub){
              var sparkW = 460, sparkH = 78;
              var panW = 143, panGap = 15;
              var panH = 48;
              var data = [
                { title:(LANG==='nl'?'KWALITEIT':'QUALITY'), color:C.quality, bg:CBG.quality,
                  data:sub.map(function(d){ return d.quality_avg; }), yMin:0, yMax:100,
                  fmt:function(v){ return Math.round(v)+'%'; } },
                { title:(LANG==='nl'?'CYCLI/DAG':'CYCLES/DAY'), color:C.heating, bg:CBG.heating,
                  data:sub.map(function(d){ return d.cycles; }), yMin:0, yMax:null,
                  fmt:function(v){ return String(Math.round(v)); } },
                { title:(LANG==='nl'?'DUUR/DAG':'DURATION/DAY'), color:C.cooling, bg:CBG.cooling,
                  data:sub.map(function(d){ return d.dur_min/60; }), yMin:0, yMax:null,
                  fmt:function(v){ return v<10 ? v.toFixed(1).replace('.',',')+'h' : Math.round(v)+'h'; } }
              ];
              var s = '<svg viewBox="0 0 '+sparkW+' '+sparkH+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">';
              for (var pi=0; pi<data.length; pi++){
                var p = data[pi];
                var panX = pi * (panW + panGap);
                var x0 = panX + 4, x1 = panX + panW - 4;
                var y0 = 22, y1 = 22 + panH;
                var w = x1-x0, hgt = y1-y0;
                var vals = p.data.filter(function(v){ return hasV(v) && isFinite(parseFloat(v)); }).map(function(v){ return parseFloat(v); });
                var dMax = vals.length > 0 ? Math.max.apply(null, vals) : 1;
                var dMin = vals.length > 0 ? Math.min.apply(null, vals) : 0;
                if (p.yMin !== null) dMin = p.yMin;
                if (p.yMax !== null) dMax = p.yMax;
                var range = dMax - dMin; if (range<=0) range=1;
                var yMax = dMax + range*0.1;
                var yMin = Math.max(p.yMin!==null?p.yMin:0, dMin - range*0.1);
                if (yMax - yMin <= 0) yMax = yMin + 1;
                var xStep = w / Math.max(1, p.data.length - 1);
                var xAt = function(i){ return x0 + i*xStep; };
                var yAt = function(v){ return y1 - ((v - yMin)/(yMax - yMin)) * hgt; };

                s += '<rect x="'+panX+'" y="0" width="'+panW+'" height="'+sparkH+'" rx="7" fill="'+p.bg+'"/>';
                s += '<text x="'+(panX+6)+'" y="14" font-family="ui-monospace,monospace" font-size="9" font-weight="900" fill="'+p.color+'" letter-spacing="0.3">'+p.title+'</text>';

                var pathD='', first=null, last=null, started=false;
                for (var si=0; si<p.data.length; si++){
                  var vv = p.data[si];
                  if (!hasV(vv) || !isFinite(parseFloat(vv))) continue;
                  var vx = xAt(si), vy = yAt(parseFloat(vv));
                  if (!started) { pathD += 'M'+vx+','+vy; first=vx; started=true; }
                  else pathD += ' L'+vx+','+vy;
                  last = vx;
                }
                if (started){
                  var areaD = pathD + ' L'+last+','+y1+' L'+first+','+y1+' Z';
                  s += '<path d="'+areaD+'" fill="'+p.color+'" opacity="0.15"/>';
                  s += '<path d="'+pathD+'" fill="none" stroke="'+p.color+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
                  for (var si2=0; si2<p.data.length; si2++){
                    var vv2 = p.data[si2];
                    if (!hasV(vv2) || !isFinite(parseFloat(vv2))) continue;
                    var dS = sub[si2];
                    var pid = buildDayPayload(dS);
                    s += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                    s += '<circle cx="'+xAt(si2)+'" cy="'+yAt(parseFloat(vv2))+'" r="10" fill="transparent" pointer-events="all"/>';
                    s += '<circle cx="'+xAt(si2)+'" cy="'+yAt(parseFloat(vv2))+'" r="'+((si2===p.data.length-1)?4:2.5)+'" fill="white" stroke="'+p.color+'" stroke-width="2" pointer-events="none"/>';
                    s += '</g>';
                  }
                }
                var lastV = p.data[p.data.length-1];
                var curTxt = (hasV(lastV) && isFinite(parseFloat(lastV))) ? p.fmt(parseFloat(lastV)) : '—';
                s += '<text x="'+(panX+panW-6)+'" y="14" text-anchor="end" font-family="ui-monospace,monospace" font-size="12" font-weight="900" fill="'+p.color+'">'+curTxt+'</text>';
              }
              s += '</svg>';
              return s;
            };

            var buildQuality = function(sub){
              var numDays = sub.length;
              var qVals = sub.filter(function(d){ return d.quality_avg !== null; }).map(function(d){ return d.quality_avg; });
              var avgQ = qVals.length > 0 ? qVals.reduce(function(a,v){ return a+v; },0)/qVals.length : null;
              var minQ = qVals.length > 0 ? Math.min.apply(null, qVals) : 0;
              var yMin = minQ >= 70 ? 60 : (minQ >= 50 ? 40 : 0);
              var yMax = 100;

              var qcH = cfgChartH, qcW = 460;
              var qcPadL = 44, qcPadR = 14, qcPadT = 30, qcPadB = 46;
              var plotW = qcW - qcPadL - qcPadR;
              var plotH = qcH - qcPadT - qcPadB;
              var slot = plotW / Math.max(1, numDays);
              var xAt = function(i){ return qcPadL + i*slot + slot/2; };
              var yAt = function(v){ var pct = (Math.max(yMin, Math.min(yMax, v)) - yMin) / (yMax - yMin); return qcPadT + plotH - pct*plotH; };
              var labelEvery = Math.max(1, Math.ceil(numDays / 12));

              var s = '<svg viewBox="0 0 '+qcW+' '+qcH+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">';
              s += '<defs><linearGradient id="sqArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1976D2" stop-opacity="0.28"/><stop offset="100%" stop-color="#1976D2" stop-opacity="0"/></linearGradient></defs>';
              if (yMin <= 70) s += '<rect x="'+qcPadL+'" y="'+yAt(100)+'" width="'+plotW+'" height="'+(yAt(Math.max(70,yMin))-yAt(100))+'" fill="'+QGOOD+'" opacity="0.08"/>';
              if (yMin < 70 && yMin < 40) s += '<rect x="'+qcPadL+'" y="'+yAt(70)+'" width="'+plotW+'" height="'+(yAt(Math.max(40,yMin))-yAt(70))+'" fill="'+QMID+'" opacity="0.06"/>';
              if (yMin < 40) s += '<rect x="'+qcPadL+'" y="'+yAt(40)+'" width="'+plotW+'" height="'+(yAt(yMin)-yAt(40))+'" fill="'+QLOW+'" opacity="0.06"/>';
              var step = (yMax - yMin) / 4;
              for (var gi=0; gi<=4; gi++){
                var gv = yMin + step*gi, gy = yAt(gv);
                s += '<line x1="'+qcPadL+'" y1="'+gy+'" x2="'+(qcPadL+plotW)+'" y2="'+gy+'" stroke="rgba(13,71,161,0.10)"/>';
                s += '<text x="'+(qcPadL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1">'+Math.round(gv)+'</text>';
              }
              if (avgQ !== null){
                var aY = yAt(avgQ);
                s += '<line x1="'+qcPadL+'" y1="'+aY+'" x2="'+(qcPadL+plotW)+'" y2="'+aY+'" stroke="'+C.gem+'" stroke-width="2" stroke-dasharray="5,4" opacity="0.75"/>';
              }
              var pts = [];
              for (var pi=0; pi<numDays; pi++){
                var dq = sub[pi];
                if (dq.quality_avg === null) continue;
                pts.push({ i:pi, q:dq.quality_avg, d:dq });
              }
              if (pts.length >= 2){
                var lineD = '';
                for (var li=0; li<pts.length; li++) lineD += (li===0?'M':' L') + xAt(pts[li].i) + ',' + yAt(pts[li].q);
                var areaD = lineD + ' L'+xAt(pts[pts.length-1].i)+','+(qcPadT+plotH)+' L'+xAt(pts[0].i)+','+(qcPadT+plotH)+' Z';
                s += '<path d="'+areaD+'" fill="url(#sqArea)"/>';
                s += '<path d="'+lineD+'" fill="none" stroke="#1976D2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
              }
              for (var vi=0; vi<pts.length; vi++){
                var pt = pts[vi];
                var pc = qColor(pt.q);
                var pid = buildDayPayload(pt.d);
                var isLatest = (vi === pts.length - 1);
                s += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                s += '<circle cx="'+xAt(pt.i)+'" cy="'+yAt(pt.q)+'" r="18" fill="transparent" pointer-events="all"/>';
                if (isLatest) s += '<circle cx="'+xAt(pt.i)+'" cy="'+yAt(pt.q)+'" r="8" fill="'+pc+'" opacity="0.6" pointer-events="none"><animate attributeName="r" values="8;18;8" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" repeatCount="indefinite"/></circle>';
                s += '<circle cx="'+xAt(pt.i)+'" cy="'+yAt(pt.q)+'" r="'+(isLatest?8.5:7)+'" fill="white" stroke="'+pc+'" stroke-width="'+(isLatest?3.5:3)+'" pointer-events="none"/>';
                s += '<circle cx="'+xAt(pt.i)+'" cy="'+yAt(pt.q)+'" r="'+(isLatest?3.5:2.5)+'" fill="'+pc+'" pointer-events="none"/>';
                s += '</g>';
                if (numDays <= 21) s += '<text x="'+xAt(pt.i)+'" y="'+(yAt(pt.q)-15)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" font-weight="900" fill="'+pc+'" '+TXT_HALO+' pointer-events="none">'+vI(pt.q)+'</text>';
              }
              for (var xi=0; xi<numDays; xi++){
                if (xi % labelEvery === 0 || xi === numDays-1){
                  s += '<text x="'+xAt(xi)+'" y="'+(qcH-26)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1">'+wd(sub[xi].day)+'</text>';
                  if (numDays <= 21) s += '<text x="'+xAt(xi)+'" y="'+(qcH-10)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="800" fill="#546E7A">'+fmtDay(sub[xi].day)+'</text>';
                }
              }
              s += '<line x1="'+qcPadL+'" y1="'+(qcPadT+plotH)+'" x2="'+(qcPadL+plotW)+'" y2="'+(qcPadT+plotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              s += '<line x1="'+qcPadL+'" y1="'+qcPadT+'" x2="'+qcPadL+'" y2="'+(qcPadT+plotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              s += '</svg>';

              var good = 0, mid = 0, low = 0;
              sub.forEach(function(d){
                if (d.quality_avg === null) return;
                if (d.quality_avg >= 70) good++;
                else if (d.quality_avg >= 40) mid++;
                else low++;
              });
              var stats = statStrip([
                {l:t('r_avgq'), v:(avgQ===null?'—':vI(avgQ)+'%'), c:qColor(avgQ)},
                {l:t('r_days_good'), v:String(good), c:QGOOD},
                {l:t('r_days_mid'), v:String(mid), c:QMID},
                {l:t('r_days_low'), v:String(low), c:QLOW}
              ]);

              return { chart: s, stats: stats };
            };

            var buildCycles = function(sub){
              var numDays = sub.length;
              var cH = 320, cW = 460;
              var cPadL = 44, cPadR = 14, cPadT = 30, cPadB = 46;
              var plotW = cW - cPadL - cPadR;
              var plotH = cH - cPadT - cPadB;
              var barW = Math.max(6, Math.min(50, (plotW / Math.max(1,numDays)) * 0.72));
              var slot = plotW / Math.max(1, numDays);
              var xAt = function(i){ return cPadL + i*slot + (slot-barW)/2; };
              var maxCy = Math.max.apply(null, sub.map(function(d){ return d.cycles; })) || 1;
              var yMax = maxCy <= 4 ? 4 : Math.ceil(maxCy/2)*2;
              var yAt = function(v){ return cPadT + plotH - (v/yMax)*plotH; };
              var labelEvery = Math.max(1, Math.ceil(numDays / 12));

              var s = '<svg viewBox="0 0 '+cW+' '+cH+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">';
              for (var gi=0; gi<=4; gi++){
                var gv = Math.round(yMax*gi/4), gy = yAt(gv);
                s += '<line x1="'+cPadL+'" y1="'+gy+'" x2="'+(cPadL+plotW)+'" y2="'+gy+'" stroke="rgba(13,71,161,0.10)"/>';
                s += '<text x="'+(cPadL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1">'+gv+'</text>';
              }
              for (var i=0; i<numDays; i++){
                var d = sub[i];
                var hc = d.modes.heating.cycles;
                var dc = d.modes.dhw.cycles;
                var cc = d.modes.cooling.cycles;
                var hCh = (hc/yMax)*plotH, dCh = (dc/yMax)*plotH, cCh = (cc/yMax)*plotH;
                var x = xAt(i), yBase = cPadT + plotH;
                var pid = buildDayPayload(d);
                s += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                s += '<rect x="'+(x-3)+'" y="'+cPadT+'" width="'+(barW+6)+'" height="'+plotH+'" fill="transparent" pointer-events="all"/>';
                if (hCh>0) s += '<rect x="'+x+'" y="'+(yBase-hCh)+'" width="'+barW+'" height="'+hCh+'" fill="'+C.heating+'" rx="2" pointer-events="none"/>';
                if (dCh>0) s += '<rect x="'+x+'" y="'+(yBase-hCh-dCh)+'" width="'+barW+'" height="'+dCh+'" fill="'+C.dhw+'" rx="2" pointer-events="none"/>';
                if (cCh>0) s += '<rect x="'+x+'" y="'+(yBase-hCh-dCh-cCh)+'" width="'+barW+'" height="'+cCh+'" fill="'+C.cooling+'" rx="2" pointer-events="none"/>';
                s += '</g>';
                if (numDays<=21 && d.cycles>0) s += '<text x="'+(x+barW/2)+'" y="'+(yBase-hCh-dCh-cCh-6)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1" pointer-events="none">'+d.cycles+'</text>';
                if (i % labelEvery === 0 || i === numDays-1){
                  s += '<text x="'+(x+barW/2)+'" y="'+(yBase+16)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1" pointer-events="none">'+wd(d.day)+'</text>';
                  if (numDays<=21) s += '<text x="'+(x+barW/2)+'" y="'+(yBase+30)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="800" fill="#546E7A" pointer-events="none">'+fmtDay(d.day)+'</text>';
                }
              }
              s += '<line x1="'+cPadL+'" y1="'+(cPadT+plotH)+'" x2="'+(cPadL+plotW)+'" y2="'+(cPadT+plotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              s += '<line x1="'+cPadL+'" y1="'+cPadT+'" x2="'+cPadL+'" y2="'+(cPadT+plotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              s += '</svg>';

              var totalCy = sub.reduce(function(a,d){ return a+d.cycles; }, 0);
              var maxDay = sub.reduce(function(a,d){ return Math.max(a, d.cycles); }, 0);
              var avgDay = sub.length > 0 ? totalCy / sub.length : 0;
              var startsId = resolveEntity('starts_today');
              var starts = startsId ? (parseFloat((states[startsId] || {}).state) || 0) : 0;

              var stats = statStrip([
                {l:t('r_total'), v:String(totalCy), c:'#0D47A1'},
                {l:t('r_avgday'), v:v1(avgDay), c:'#1565C0'},
                {l:t('r_maxday'), v:String(maxDay), c:C.heating},
                {l:t('r_starts'), v:String(starts), c:(starts>0?C.heating:'#94a3b8')}
              ]);
              return { chart: s, stats: stats };
            };

            var buildDuration = function(sub){
              var numDays = sub.length;
              var cH = 320, cW = 460;
              var cPadL = 46, cPadR = 14, cPadT = 30, cPadB = 46;
              var plotW = cW - cPadL - cPadR;
              var plotH = cH - cPadT - cPadB;
              var realDur = sub.filter(function(d){ return d.dur_min>0 && d.dur_min<=1440; }).map(function(d){ return d.dur_min/60; }).sort(function(a,b){ return a-b; });
              var p95 = realDur.length > 0 ? realDur[Math.floor(realDur.length*0.95)] : 4;
              var maxReal = realDur.length > 0 ? realDur[realDur.length-1] : 4;
              var cap = Math.max(4, Math.min(24, Math.ceil(Math.max(p95*1.15, 4))));
              if (maxReal<=24 && maxReal<=cap*1.3) cap = Math.max(4, Math.ceil(maxReal));
              var barW = Math.max(6, Math.min(50, (plotW/numDays)*0.72));
              var slot = plotW / Math.max(1, numDays);
              var xAt = function(i){ return cPadL + i*slot + (slot-barW)/2; };
              var yAt = function(v){ return cPadT + plotH - (Math.min(v, cap)/cap)*plotH; };
              var labelEvery = Math.max(1, Math.ceil(numDays / 12));

              var s = '<svg viewBox="0 0 '+cW+' '+cH+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">';
              for (var gi=0; gi<=4; gi++){
                var gv = cap*gi/4, gy = yAt(gv);
                var lbl = gv<1 ? gv.toFixed(1).replace('.',',') : Math.round(gv).toString();
                s += '<line x1="'+cPadL+'" y1="'+gy+'" x2="'+(cPadL+plotW)+'" y2="'+gy+'" stroke="rgba(13,71,161,0.10)"/>';
                s += '<text x="'+(cPadL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1">'+lbl+'h</text>';
              }
              for (var i=0; i<numDays; i++){
                var d = sub[i];
                var hours = d.dur_min / 60;
                var clipped = hours > cap;
                var displayH = Math.min(hours, cap);
                var hTotal = (displayH/cap)*plotH;
                var x = xAt(i), yBase = cPadT + plotH;
                var hH = d.modes.heating.dur/60;
                var hD = d.modes.dhw.dur/60;
                var hC = d.modes.cooling.dur/60;
                var totalH = hH + hD + hC;
                var scale = totalH > 0 ? displayH/totalH : 0;
                var hPx = ((hH*scale)/cap)*plotH;
                var dPx = ((hD*scale)/cap)*plotH;
                var cPx = ((hC*scale)/cap)*plotH;
                var pid = buildDayPayload(d);
                s += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                s += '<rect x="'+(x-3)+'" y="'+cPadT+'" width="'+(barW+6)+'" height="'+plotH+'" fill="transparent" pointer-events="all"/>';
                if (hPx>0) s += '<rect x="'+x+'" y="'+(yBase-hPx)+'" width="'+barW+'" height="'+hPx+'" fill="'+C.heating+'" rx="2" pointer-events="none"/>';
                if (dPx>0) s += '<rect x="'+x+'" y="'+(yBase-hPx-dPx)+'" width="'+barW+'" height="'+dPx+'" fill="'+C.dhw+'" rx="2" pointer-events="none"/>';
                if (cPx>0) s += '<rect x="'+x+'" y="'+(yBase-hPx-dPx-cPx)+'" width="'+barW+'" height="'+cPx+'" fill="'+C.cooling+'" rx="2" pointer-events="none"/>';
                if (clipped) s += '<line x1="'+(x-3)+'" y1="'+(yBase-hTotal)+'" x2="'+(x+barW+3)+'" y2="'+(yBase-hTotal)+'" stroke="'+QLOW+'" stroke-width="2.5" pointer-events="none"/>';
                s += '</g>';
                if (numDays<=21 && hours>0){
                  var ltxt = hours<1 ? vI(hours*60)+'m' : hours.toFixed(1).replace('.',',')+'h';
                  s += '<text x="'+(x+barW/2)+'" y="'+(yBase-hTotal-6)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="900" fill="'+(clipped?QLOW:'#0D47A1')+'" pointer-events="none">'+(clipped?'⚠':'')+ltxt+'</text>';
                }
                if (i % labelEvery === 0 || i === numDays-1){
                  s += '<text x="'+(x+barW/2)+'" y="'+(yBase+16)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1" pointer-events="none">'+wd(d.day)+'</text>';
                  if (numDays<=21) s += '<text x="'+(x+barW/2)+'" y="'+(yBase+30)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="800" fill="#546E7A" pointer-events="none">'+fmtDay(d.day)+'</text>';
                }
              }
              s += '<line x1="'+cPadL+'" y1="'+(cPadT+plotH)+'" x2="'+(cPadL+plotW)+'" y2="'+(cPadT+plotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              s += '<line x1="'+cPadL+'" y1="'+cPadT+'" x2="'+cPadL+'" y2="'+(cPadT+plotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              s += '</svg>';

              var totCy = sub.reduce(function(a,d){ return a+d.cycles; }, 0);
              var totDur = sub.reduce(function(a,d){ return a+d.dur_min; }, 0);
              var avgCyc = totCy > 0 ? totDur / totCy : 0;
              var maxDur = sub.reduce(function(a,d){ return Math.max(a, d.dur_min); }, 0);

              var stats = statStrip([
                {l:t('r_totaldur'), v:fmtBigHours(totDur/60), c:'#0D47A1'},
                {l:t('r_avgcyc'), v:fmtBigMin(avgCyc), c:'#1565C0'},
                {l:t('r_maxdur'), v:fmtBigMin(maxDur), c:C.cooling},
                {l:t('r_cap'), v:cap+'h', c:'#94a3b8'}
              ]);
              return { chart: s, stats: stats };
            };

            var buildEvents = function(sub){
              var numDays = sub.length;
              var labelEvery = Math.max(1, Math.ceil(numDays / 12));

              var ID_BUH     = resolveEntity('runtime_buh');
              var ID_DEFCNT  = resolveEntity('defrost_count');
              var ID_DEFDUR  = resolveEntity('defrost_duration');
              var ID_DUTY    = resolveEntity('duty_cycle');
              var ID_STARTS  = resolveEntity('starts_today');

              var buhSec = ID_BUH     ? (parseFloat((states[ID_BUH]     || {}).state) || 0) : 0;
              var buhKwh = aN(ID_BUH,     'buh_energy_kwh_est', 0);
              var buhS1  = aN(ID_BUH,     'step1_s', 0);
              var buhS2  = aN(ID_BUH,     'step2_s', 0);
              var defCnt = ID_DEFCNT  ? (parseFloat((states[ID_DEFCNT]  || {}).state) || 0) : 0;
              var defAvg = aN(ID_DEFDUR,  'avg_duration_s', 0);
              var defLast = aN(ID_DEFCNT, 'last_defrost_ts', 0);
              var dutyPct = ID_DUTY   ? (parseFloat((states[ID_DUTY]    || {}).state) || 0) : 0;
              var dutyBand = ID_DUTY  ? String(attr(ID_DUTY, 'band', '') || '') : '';
              var startsT = ID_STARTS ? (parseFloat((states[ID_STARTS]  || {}).state) || 0) : 0;

              var dutyCol = dutyBand === 'nominal' ? QGOOD : (dutyBand === 'low' ? '#0097E0' : (dutyBand === 'high' ? QMID : '#94a3b8'));
              var buhCol = buhSec > 0 ? C.buh : '#94a3b8';
              var defCol = defCnt > 0 ? C.defrost : '#94a3b8';
              var dutyLabel = dutyBand === 'nominal' ? (LANG==='nl'?'nominaal':'nominal')
                            : dutyBand === 'low' ? (LANG==='nl'?'laag':'low')
                            : dutyBand === 'high' ? (LANG==='nl'?'hoog':'high') : '—';

              var buhPid = registerPayload({
                title: '⚡ BUH · '+(LANG==='nl'?'vandaag':'today'),
                items: [
                  { k:t('r_totaldur'), v:fmtSec(buhSec), hl:true },
                  { k:t('p_step')+' 1', v:fmtSec(buhS1) },
                  { k:t('p_step')+' 2', v:fmtSec(buhS2) },
                  { k:t('p_energy'), v:v1(buhKwh)+' kWh', c:C.buh },
                  { k:t('r_span'), v:(LANG==='nl'?'Sinds 00:00':'Since midnight') }
                ]
              });
              var defPid = registerPayload({
                title: '❄ Defrost · '+(LANG==='nl'?'vandaag':'today'),
                items: [
                  { k:t('r_cycles'), v:defCnt+'×', c:C.defrost, hl:true },
                  { k:t('r_avgdur2'), v:fmtSec(defAvg) },
                  { k:t('r_lastdef'), v:(defLast>0?fmtSec(Date.now()/1000-defLast)+' '+(LANG==='nl'?'geleden':'ago'):'—') }
                ]
              });
              var dutyPid = registerPayload({
                title: '⚙ Duty · '+(LANG==='nl'?'vandaag':'today'),
                items: [
                  { k:t('r_duty'), v:v1(dutyPct)+'%', c:dutyCol, hl:true },
                  { k:t('p_band'), v:dutyLabel, c:dutyCol },
                  { k:t('p_runtime'), v:fmtSec(aN(ID_DUTY,'runtime_s',0)) },
                  { k:t('p_elapsed'), v:fmtSec(aN(ID_DUTY,'elapsed_s',0)) }
                ]
              });
              var startsPid = registerPayload({
                title: '🔄 '+(LANG==='nl'?'Starts':'Starts'),
                items: [
                  { k:t('r_starts'), v:String(startsT), hl:true }
                ]
              });

              var tile = function(icon, lbl, val, sub2, col, pid){
                return '<div class="pa-event-tile" data-pa-action="detail" data-pa-pid="'+pid+'" style="border-color:'+col+';cursor:pointer;">'
                  + '<div class="pa-et-ic">'+icon+'</div>'
                  + '<div class="pa-et-lbl" style="color:'+col+'">'+lbl+'</div>'
                  + '<div class="pa-et-val" style="color:'+col+'">'+val+'</div>'
                  + '<div class="pa-et-sub">'+sub2+'</div>'
                  + '</div>';
              };
              var buhSub = (buhS1>0||buhS2>0) ? ('S1 '+fmtSec(buhS1)+' · S2 '+fmtSec(buhS2)) : '—';
              var defSub = defCnt > 0 ? ('Ø '+fmtSec(defAvg)) : '—';
              var today = '<div class="pa-block">';
              today += '<div class="pa-block-hdr"><span>🔥 '+(LANG==='nl'?'Vandaag':'Today')+'</span><span>live</span></div>';
              today += '<div class="pa-event-tiles">';
              today += tile('⚡', 'BUH', fmtSec(buhSec), buhSub + ' · ' + v1(buhKwh)+' kWh', buhCol, buhPid);
              today += tile('❄', 'Defrost', defCnt+'×', defSub, defCol, defPid);
              today += tile('⚙', 'Duty', v1(dutyPct)+'%', dutyLabel, dutyCol, dutyPid);
              today += tile('🔄', 'Starts', String(startsT), LANG==='nl'?'vandaag':'today', startsT > 0 ? '#1565C0' : '#94a3b8', startsPid);
              today += '</div></div>';

              var cW = 460, cH = 190;
              var cPadL = 70, cPadR = 14, cPadT = 24, cPadB = 40;
              var plotW = cW - cPadL - cPadR;
              var slot = plotW / Math.max(1, numDays);
              var xAt = function(i){ return cPadL + i*slot + slot/2; };
              var rowH = 42;
              var badgeW = Math.min(slot*0.55, 38);
              var badgeH = 26;
              var hasB = sub.some(function(d){ return d.buh>0; });
              var hasD = sub.some(function(d){ return d.defrost>0; });

              var countsSvg = '';
              if (!hasB && !hasD){
                countsSvg = '<div class="pa-empty">'+t('no_data')+'</div>';
              } else {
                var maxTot = Math.max.apply(null, sub.map(function(d){ return (d.buh||0) + (d.defrost||0); })) || 1;
                countsSvg = '<svg viewBox="0 0 '+cW+' '+cH+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">';

                /* BUH row */
                if (hasB){
                  countsSvg += '<rect x="'+cPadL+'" y="'+cPadT+'" width="'+plotW+'" height="32" rx="6" fill="'+CBG.buh+'" opacity="0.7"/>';
                  countsSvg += '<text x="'+(cPadL-8)+'" y="'+(cPadT+22)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="'+C.buh+'">⚡ '+t('leg_buh')+'</text>';
                }
                /* Defrost row */
                if (hasD){
                  var yD = cPadT + rowH;
                  countsSvg += '<rect x="'+cPadL+'" y="'+yD+'" width="'+plotW+'" height="32" rx="6" fill="'+CBG.defrost+'" opacity="0.7"/>';
                  countsSvg += '<text x="'+(cPadL-8)+'" y="'+(yD+22)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="'+C.defrost+'">❄ '+t('leg_defr')+'</text>';
                }
                /* Total row */
                var yT = cPadT + rowH*2;
                countsSvg += '<rect x="'+cPadL+'" y="'+yT+'" width="'+plotW+'" height="32" rx="6" fill="'+CBG.total+'" opacity="0.85"/>';
                countsSvg += '<text x="'+(cPadL-8)+'" y="'+(yT+22)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="'+C.total+'">∑ '+t('r_total')+'</text>';

                /* Badges per day */
                for (var ci=0; ci<numDays; ci++){
                  var d = sub[ci];
                  var xc = xAt(ci);
                  var pid = buildDayPayload(d);
                  var total = (d.buh||0) + (d.defrost||0);

                  if (hasB && d.buh > 0){
                    countsSvg += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                    countsSvg += '<rect x="'+(xc-badgeW/2)+'" y="'+(cPadT+3)+'" width="'+badgeW+'" height="'+badgeH+'" rx="4" fill="'+C.buh+'" pointer-events="all"/>';
                    countsSvg += '<text x="'+xc+'" y="'+(cPadT+3+badgeH/2+4)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="900" fill="white" pointer-events="none">'+d.buh+'</text>';
                    countsSvg += '</g>';
                  } else if (hasB){
                    countsSvg += '<text x="'+xc+'" y="'+(cPadT+20)+'" text-anchor="middle" font-size="11" fill="rgba(230,81,0,0.3)">·</text>';
                  }

                  if (hasD && d.defrost > 0){
                    var yD2 = cPadT + rowH;
                    countsSvg += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                    countsSvg += '<rect x="'+(xc-badgeW/2)+'" y="'+(yD2+3)+'" width="'+badgeW+'" height="'+badgeH+'" rx="4" fill="'+C.defrost+'" pointer-events="all"/>';
                    countsSvg += '<text x="'+xc+'" y="'+(yD2+3+badgeH/2+4)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="900" fill="white" pointer-events="none">'+d.defrost+'</text>';
                    countsSvg += '</g>';
                  } else if (hasD){
                    var yD3 = cPadT + rowH;
                    countsSvg += '<text x="'+xc+'" y="'+(yD3+20)+'" text-anchor="middle" font-size="11" fill="rgba(25,118,210,0.3)">·</text>';
                  }

                  if (total > 0){
                    var yT2 = cPadT + rowH*2;
                    var wRatio = Math.max(0.35, total / maxTot);
                    var wFill = badgeW * wRatio;
                    countsSvg += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                    countsSvg += '<rect x="'+(xc-badgeW/2)+'" y="'+(yT2+3)+'" width="'+badgeW+'" height="'+badgeH+'" rx="4" fill="rgba(84,110,122,0.15)" pointer-events="all"/>';
                    countsSvg += '<rect x="'+(xc-badgeW/2)+'" y="'+(yT2+3)+'" width="'+wFill.toFixed(1)+'" height="'+badgeH+'" rx="4" fill="'+C.total+'" pointer-events="none"/>';
                    countsSvg += '<text x="'+xc+'" y="'+(yT2+3+badgeH/2+4)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" font-weight="900" fill="white" pointer-events="none">'+total+'</text>';
                    countsSvg += '</g>';
                  } else {
                    var yT4 = cPadT + rowH*2;
                    countsSvg += '<text x="'+xc+'" y="'+(yT4+20)+'" text-anchor="middle" font-size="11" fill="rgba(84,110,122,0.3)">·</text>';
                  }

                  if (ci % labelEvery === 0 || ci === numDays-1){
                    countsSvg += '<text x="'+xc+'" y="'+(cH-14)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1" pointer-events="none">'+wd(d.day)+'</text>';
                  }
                }
                countsSvg += '</svg>';
              }

              /* ratio chart (unchanged) */
              var rW = 460, rH = 240;
              var rPadL = 46, rPadR = 14, rPadT = 30, rPadB = 60;
              var rPlotW = rW - rPadL - rPadR;
              var rPlotH = rH - rPadT - rPadB;
              var rSlot = rPlotW / Math.max(1, numDays);
              var rBarW = Math.max(6, Math.min(42, rSlot * 0.72));
              var rX = function(i){ return rPadL + i*rSlot + (rSlot - rBarW)/2; };
              var rY = function(v){ return rPadT + rPlotH - (Math.max(0, Math.min(100, v))/100) * rPlotH; };

              var rateSvg = '<svg viewBox="0 0 '+rW+' '+rH+'" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block;">';
              for (var gi=0; gi<=4; gi++){
                var gv = 25*gi, gy = rY(gv);
                rateSvg += '<line x1="'+rPadL+'" y1="'+gy+'" x2="'+(rPadL+rPlotW)+'" y2="'+gy+'" stroke="rgba(13,71,161,0.10)"/>';
                rateSvg += '<text x="'+(rPadL-6)+'" y="'+(gy+4)+'" text-anchor="end" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1">'+gv+'%</text>';
              }
              var tRef = rY(15);
              rateSvg += '<line x1="'+rPadL+'" y1="'+tRef+'" x2="'+(rPadL+rPlotW)+'" y2="'+tRef+'" stroke="rgba(46,125,50,0.45)" stroke-width="1.5" stroke-dasharray="4,4"/>';
              var tRef2 = rY(35);
              rateSvg += '<line x1="'+rPadL+'" y1="'+tRef2+'" x2="'+(rPadL+rPlotW)+'" y2="'+tRef2+'" stroke="rgba(198,40,40,0.45)" stroke-width="1.5" stroke-dasharray="4,4"/>';

              for (var ri=0; ri<numDays; ri++){
                var dd = sub[ri];
                if (dd.cycles === 0) continue;
                var buhPct = Math.min(100, (dd.buh / dd.cycles) * 100);
                var defPct = Math.min(100, (dd.defrost / dd.cycles) * 100);
                var x = rX(ri), yBase = rPadT + rPlotH;
                var hDef = (defPct/100)*rPlotH;
                var hBuh = (buhPct/100)*rPlotH;
                var yTopDef = yBase - hDef;
                var yTopBuh = yTopDef - hBuh;
                var pid = buildDayPayload(dd);
                rateSvg += '<g class="pa-hit" data-pa-action="detail" data-pa-pid="'+pid+'" style="cursor:pointer;" pointer-events="all">';
                rateSvg += '<rect x="'+(x-3)+'" y="'+rPadT+'" width="'+(rBarW+6)+'" height="'+rPlotH+'" fill="transparent" pointer-events="all"/>';
                if (hDef > 0) rateSvg += '<rect x="'+x+'" y="'+yTopDef+'" width="'+rBarW+'" height="'+hDef+'" fill="'+C.defrost+'" rx="2" pointer-events="none"/>';
                if (hBuh > 0) rateSvg += '<rect x="'+x+'" y="'+yTopBuh+'" width="'+rBarW+'" height="'+hBuh+'" fill="'+C.buh+'" rx="2" pointer-events="none"/>';
                rateSvg += '</g>';
                if (numDays <= 21 && (buhPct + defPct) > 0){
                  rateSvg += '<text x="'+(x+rBarW/2)+'" y="'+(yTopBuh-5)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" font-weight="900" fill="#0D47A1" pointer-events="none">'+vI(buhPct+defPct)+'%</text>';
                }
                if (ri % labelEvery === 0 || ri === numDays-1){
                  rateSvg += '<text x="'+(x+rBarW/2)+'" y="'+(yBase+16)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" font-weight="900" fill="#0D47A1" pointer-events="none">'+wd(dd.day)+'</text>';
                  if (numDays <= 21) rateSvg += '<text x="'+(x+rBarW/2)+'" y="'+(yBase+30)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" font-weight="800" fill="#546E7A" pointer-events="none">'+fmtDay(dd.day)+'</text>';
                }
              }
              rateSvg += '<line x1="'+rPadL+'" y1="'+(rPadT+rPlotH)+'" x2="'+(rPadL+rPlotW)+'" y2="'+(rPadT+rPlotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              rateSvg += '<line x1="'+rPadL+'" y1="'+rPadT+'" x2="'+rPadL+'" y2="'+(rPadT+rPlotH)+'" stroke="#0D47A1" stroke-width="1.5"/>';
              rateSvg += '</svg>';

              var totB = sub.reduce(function(a,d){ return a+d.buh; }, 0);
              var totD = sub.reduce(function(a,d){ return a+d.defrost; }, 0);
              var totC = sub.reduce(function(a,d){ return a+d.cycles; }, 0);
              var avgRatio = totC > 0 ? ((totB + totD) / totC * 100) : 0;
              var lastDefStr = '—';
              if (defLast > 0){
                var nowS = Date.now()/1000;
                var diffS = nowS - defLast;
                if (diffS < 3600) lastDefStr = Math.round(diffS/60)+'m';
                else if (diffS < 86400) lastDefStr = Math.round(diffS/3600)+'h';
                else lastDefStr = Math.round(diffS/86400)+'d';
              }
              var stats = statStrip([
                {l:t('r_totalbuh'), v:String(totB), c:C.buh},
                {l:t('r_totaldef'), v:String(totD), c:C.defrost},
                {l:t('r_avgratio'), v:vI(avgRatio)+'%', c:(avgRatio<=15?QGOOD:(avgRatio<=35?QMID:QLOW))},
                {l:t('r_lastdef'), v:lastDefStr, c:'#546E7A'}
              ]);

              return { today: today, counts: countsSvg, ratio: rateSvg, stats: stats, hasB: hasB, hasD: hasD };
            };

            var chip = function(col, bg, label){
              return '<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 6px;border-radius:8px;background:'+bg+';border:1px solid '+col+'55;font-size:0.62em;font-weight:900;color:'+col+';white-space:nowrap;line-height:1.2;">'
                + '<span style="width:5px;height:5px;border-radius:50%;background:'+col+';flex-shrink:0;"></span>'+label+'</span>';
            };
            var chipRow = function(arr, extra){
              var s = '<div class="pa-chips">';
              for (var i=0; i<arr.length; i++) s += chip(arr[i].col, arr[i].bg, arr[i].label);
              if (extra) s += '<span style="margin-left:auto;font-size:0.62em;font-weight:800;color:#546E7A;">'+extra+'</span>';
              s += '</div>';
              return s;
            };

            var buildView = function(winSize){
              var sub = daysAll.slice(-winSize);
              if (sub.length === 0) return '<div class="pa-view" data-win="'+winSize+'"><div class="pa-empty">⏳ '+t('no_data')+'</div></div>';

              var h = '<div class="pa-view" data-win="'+winSize+'">';

              h += '<div class="tab-pane" data-tab-pane="overview">';
              h += buildOverview(sub, 'w'+winSize);
              if (cfgShowHints) h += '<div class="pa-note">'+t('n_overview')+'</div>';
              h += '</div>';

              var q = buildQuality(sub);
              h += '<div class="tab-pane" data-tab-pane="quality">';
              h += '<div class="pa-block">';
              h += '<div class="pa-block-hdr"><span>⭐ '+t('qual_chart')+'</span><span>'+sub.length+'d</span></div>';
              h += q.chart;
              h += q.stats;
              h += chipRow([
                {col:QGOOD, bg:'#E8F5E9', label:t('q_good')},
                {col:QMID, bg:'#FFF3E0', label:t('q_mid')},
                {col:QLOW, bg:'#FFEBEE', label:t('q_low')}
              ], '');
              if (cfgShowHints) h += '<div class="pa-note">'+t('n_quality')+'</div>';
              h += '</div></div>';

              var c = buildCycles(sub);
              h += '<div class="tab-pane" data-tab-pane="cycles">';
              h += '<div class="pa-block">';
              h += '<div class="pa-block-hdr"><span>🔄 '+t('cycles_chart')+'</span><span>'+sub.length+'d</span></div>';
              h += c.chart;
              h += c.stats;
              h += chipRow([
                {col:C.heating, bg:CBG.heating, label:t('leg_heat')},
                {col:C.dhw, bg:CBG.dhw, label:t('leg_dhw')},
                {col:C.cooling, bg:CBG.cooling, label:t('leg_cool')}
              ], '');
              if (cfgShowHints) h += '<div class="pa-note">'+t('n_cycles')+'</div>';
              h += '</div></div>';

              var du = buildDuration(sub);
              h += '<div class="tab-pane" data-tab-pane="duration">';
              h += '<div class="pa-block">';
              h += '<div class="pa-block-hdr"><span>⏱️ '+t('dur_chart')+'</span><span>'+sub.length+'d</span></div>';
              h += du.chart;
              h += du.stats;
              h += chipRow([
                {col:C.heating, bg:CBG.heating, label:t('leg_heat')},
                {col:C.dhw, bg:CBG.dhw, label:t('leg_dhw')},
                {col:C.cooling, bg:CBG.cooling, label:t('leg_cool')}
              ], '');
              if (cfgShowHints) h += '<div class="pa-note">'+t('n_duration')+'</div>';
              h += '</div></div>';

              var ev = buildEvents(sub);
              h += '<div class="tab-pane" data-tab-pane="events">';
              h += ev.today;
              h += '<div class="pa-block">';
              h += '<div class="pa-block-hdr"><span>📊 '+t('ev_chart')+'</span><span>'+sub.length+'d</span></div>';
              h += ev.counts;
              var evChips = [];
              if (ev.hasB) evChips.push({col:C.buh, bg:CBG.buh, label:'⚡ '+t('leg_buh')});
              if (ev.hasD) evChips.push({col:C.defrost, bg:CBG.defrost, label:'❄ '+t('leg_defr')});
              evChips.push({col:C.total, bg:CBG.total, label:'∑ '+t('r_total')});
              h += chipRow(evChips, '');
              h += '</div>';
              h += '<div class="pa-block">';
              h += '<div class="pa-block-hdr"><span>📈 '+t('ev_ratio')+'</span><span>% '+(LANG==='nl'?'van cycli':'of cycles')+'</span></div>';
              h += ev.ratio;
              h += ev.stats;
              h += chipRow([
                {col:C.defrost, bg:CBG.defrost, label:'❄ '+t('leg_defr')},
                {col:C.buh, bg:CBG.buh, label:'⚡ '+t('leg_buh')},
                {col:QGOOD, bg:'#E8F5E9', label:'-- 15%'},
                {col:QLOW, bg:'#FFEBEE', label:'-- 35%'}
              ], '');
              if (cfgShowHints) h += '<div class="pa-note">'+t('n_events')+'</div>';
              h += '</div></div>';

              h += '</div>';
              return h;
            };

