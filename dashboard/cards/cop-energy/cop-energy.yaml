type: custom:stack-in-card
variables: {theme_override: light, lang_override: ''}
card_mod:
  style: |
    ha-card {
      --a:#1976D2;--a2:#29B6F6;--ad:rgba(25,118,210,0.4);--ic:#1565C0;--tx:#000000;--mu:#444444;
      --gd:#2E7D32;--wn:#E65100;--bd2:#C62828;--pu:#6A1B9A;
      --sf:rgba(25,118,210,0.06);--sf2:rgba(25,118,210,0.04);--b:rgba(25,118,210,0.18);--b2:rgba(25,118,210,0.10);
      --lv:rgba(25,118,210,0.08);--lvb:rgba(25,118,210,0.35);--hl:#FFF;--sh:rgba(25,118,210,0.20);
      border:3px solid var(--a);border-radius:20px;
      background:radial-gradient(circle at 15% 0%,rgba(25,118,210,0.10),transparent 55%),radial-gradient(circle at 85% 100%,rgba(25,118,210,0.14),transparent 55%),linear-gradient(135deg,#F5FAFE 0%,#E8F2FB 55%,#DCEBFA 100%);
      box-shadow:0 10px 28px var(--sh),inset 0 1px 0 rgba(255,255,255,0.5);
      overflow:visible;color:var(--tx) !important;
    }
    :host-context(html[data-dk-theme="dark"]) ha-card {
      --a:#00A0E9;--a2:#29B6F6;--ad:rgba(0,160,233,0.42);--ic:#B3E5FC;--tx:#FFFFFF;--mu:#B0C4DE;
      --gd:#4ADE80;--wn:#FBBF24;--bd2:#F87171;--pu:#C084FC;
      --sf:rgba(255,255,255,0.045);--sf2:rgba(255,255,255,0.03);--b:rgba(179,229,252,0.14);--b2:rgba(179,229,252,0.08);
      --lv:rgba(0,160,233,0.14);--lvb:rgba(0,160,233,0.42);--hl:#001B3D;--sh:rgba(0,160,233,0.30);
      background:radial-gradient(circle at 15% 0%,rgba(0,160,233,0.20),transparent 55%),radial-gradient(circle at 85% 100%,rgba(0,58,112,0.45),transparent 55%),linear-gradient(135deg,#001B3D 0%,#003A70 55%,#005a9c 100%);
      box-shadow:0 12px 40px var(--sh),inset 0 1px 0 rgba(255,255,255,0.08);
    }
cards:
  - type: custom:mushroom-template-card
    primary: >-
      {%- set s = states.sensor | selectattr('entity_id','search','(hp_specs|wp_specs)$') | list | first -%}
      Daikin Cycle ML{% if s and s.state not in ['unknown','unavailable','none'] %} · {{ s.state | upper }}{% endif %}
    secondary: >-
      {%- set s = states.sensor | selectattr('entity_id','search','(hp_specs|wp_specs)$') | list | first -%}
      {%- if s and s.attributes -%}{{ s.attributes.kw }}kW {{ s.attributes.family }} · {{ s.attributes.refrigerant }} · {{ 'COP et énergie' if state_attr('sensor.daikin_cycle_ml_cycle_state','configured_language') == 'fr' else 'COP & Energie' }}{%- else -%}COP · Energie · live{%- endif -%}
    icon: mdi:heat-pump
    multiline_secondary: true
    card_mod:
      style: |
        ha-card{background:none !important;box-shadow:none !important;border-bottom:2px solid var(--ad) !important;border-radius:0 !important;padding:10px 16px !important}
        .primary{color:var(--a) !important;font-weight:900 !important;font-size:1.02em !important;text-transform:uppercase !important;letter-spacing:1.1px !important;text-shadow:0 0 16px var(--ad) !important}
        .secondary{color:var(--ic) !important;opacity:0.85 !important;font-size:0.76em !important;font-weight:700 !important}
        mushroom-shape-icon{--icon-color:var(--a) !important}
