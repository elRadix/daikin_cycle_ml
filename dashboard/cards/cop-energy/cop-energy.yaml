            var chip=function(l,n,col){col=col||C.tx;return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;background:'+C.sf2+';border:1px solid '+C.b+';border-radius:6px;color:'+C.mu+'">'+l+' <b style="color:'+col+';font-weight:900">'+n+'</b></span>';};
            if(run){
              var modeCol=cm==='heating'?C.bd:cm==='dhw'?C.pu:cm==='cooling'?'#38BDF8':C.a;
              var modeIc=cm==='heating'?'🔥':cm==='dhw'?'💧':cm==='cooling'?'❄️':'⚙️';
              var modeNm=cm==='heating'?T('Verwarming','Heating'):cm==='dhw'?T('SWW','DHW'):cm==='cooling'?T('Koeling','Cooling'):cm.toUpperCase();
              var fanDur=(rp>0.5)?Math.max(0.3,Math.min(2.5,12/rp)).toFixed(2):null;
              var fan='<svg viewBox="0 0 110 110" style="width:100%;max-width:90px;height:auto;display:block;margin:0 auto">';
              fan+='<circle cx="55" cy="55" r="52" fill="'+modeCol+'10" stroke="'+modeCol+'44" stroke-width="1.5"/>';
              fan+='<circle cx="55" cy="55" r="45" fill="none" stroke="'+modeCol+'22" stroke-width="0.8" stroke-dasharray="3,4"/>';
              fan+='<g transform="translate(55,55)">'+(fanDur?'<g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="'+fanDur+'s" repeatCount="indefinite"/>':'<g>');
              fan+='<circle r="7" fill="'+modeCol+'"/>';
              [0,120,240].forEach(function(a){fan+='<path d="M 0,-8 Q 15,-13 17,-37 Q 6,-24 0,-13 Z" fill="'+modeCol+'" opacity="0.92" transform="rotate('+a+')"/>';});
              fan+='</g></g></svg>';
              var pEl = elW / 1000;
              var pTh = th;
              var cop = pTh > 0 ? pTh / pEl : 0;
              var elPct = cop > 0 ? (1 / cop) * 100 : 0;
              if(elPct > 100) elPct = 100;
              var p3='<div style="background:linear-gradient(135deg,'+modeCol+'14,'+C.sf+');border:1.5px solid '+modeCol+'55;border-radius:14px;padding:14px;margin-bottom:8px;position:relative;overflow:hidden">';
              p3+='<div style="position:absolute;top:-40px;right:-40px;width:140px;height:140px;background:'+modeCol+';border-radius:50%;opacity:0.10;filter:blur(30px);pointer-events:none"></div>';
              p3+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative">';
              p3+='<div style="display:flex;align-items:center;gap:8px"><span class="dkDot" style="width:9px;height:9px;border-radius:50%;background:'+C.gd+';display:inline-block"></span>';
              p3+='<span style="font-size:12.5px;font-weight:900;letter-spacing:1.3px;color:'+C.gd+'">'+T('ACTIEF','RUNNING')+'</span>';
              p3+='<span style="color:'+C.mu+'">·</span>';
              p3+='<span style="font-size:12.5px;font-weight:900;color:'+modeCol+'">'+modeIc+' '+modeNm.toUpperCase()+'</span></div>';
              p3+='<span style="font-size:11.5px;font-weight:800;color:'+C.mu+'">'+f1(du)+' min</span></div>';
              p3+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:16px;position:relative">';
              p3+='<div style="text-align:center"><div style="font-size:10.5px;font-weight:900;letter-spacing:0.6px;color:'+C.mu+';margin-bottom:3px">⚡ '+T('ELEKTRISCH','ELECTRICAL')+'</div>';
              p3+='<div class="dkN" style="font-size:1.65em;color:'+C.wn+';line-height:1">'+fi(elW)+'<span style="font-size:0.5em;color:'+C.mu+';margin-left:3px">W</span></div></div>';
              p3+='<div style="text-align:center;min-width:90px">'+fan+'<div style="font-size:10.5px;font-weight:800;color:'+C.mu+';margin-top:3px;letter-spacing:0.4px">'+(rp>0?fi(rp)+' RPS':'—')+'</div></div>';
              p3+='<div style="text-align:center"><div style="font-size:10.5px;font-weight:900;letter-spacing:0.6px;color:'+C.mu+';margin-bottom:3px">'+modeIc+' '+T('THERMISCH','THERMAL')+'</div>';
              p3+='<div class="dkN" style="font-size:1.65em;color:'+modeCol+';line-height:1">'+f2(th)+'<span style="font-size:0.5em;color:'+C.mu+';margin-left:3px">kW</span></div></div></div>';
              p3+='<div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:900;margin-bottom:4px;position:relative">';
              p3+='<span style="color:'+C.wn+'">⚡ '+T('IN','IN')+' ('+f1(elPct)+'%)</span>';
              p3+='<span style="color:'+modeCol+'">'+T('OUT','OUT')+' ('+f1(100-elPct)+'%) 🔥</span></div>';
              p3+='<div style="position:relative;height:14px;background:'+C.sf2+';border-radius:7px;overflow:hidden;margin-bottom:12px">';
              p3+='<div style="position:absolute;top:0;left:0;height:100%;width:'+elPct+'%;background:linear-gradient(90deg,'+C.wn+'cc,'+C.wn+')"></div>';
              p3+='<div style="position:absolute;top:0;left:'+elPct+'%;height:100%;width:'+(100-elPct)+'%;background:linear-gradient(90deg,'+modeCol+'cc,'+modeCol+')"></div></div>';
              p3+='<div style="text-align:center;margin-bottom:12px;position:relative"><span style="display:inline-flex;align-items:center;gap:8px;background:'+modeCol+';color:#fff;padding:6px 18px;border-radius:16px;font-size:14px;font-weight:900;box-shadow:0 3px 12px '+modeCol+'55">';
              p3+='<span style="opacity:0.9">'+T('COP','COP')+'</span><span class="dkN" style="font-size:18px">'+f2(iC)+'</span><span style="opacity:0.85;font-size:12px">· '+gd(iC)+'</span></span></div>';
              p3+='<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;position:relative">';
              p3+=chip('ΔT',f1(dtK)+'K')+chip(NL?'Debiet':(LANG==='fr'?'Débit':'Flow'),f1(fl)+' L/m')+chip('RPS',fi(rp))+'</div></div>';
              r+=p3;
            } else {
              var lastMode=cm&&cm!=='idle'?cm:null;
              var lastIc=lastMode==='heating'?'🔥':lastMode==='dhw'?'💧':lastMode==='cooling'?'❄️':'⚙️';
              var lastNm=lastMode==='heating'?T('Verwarming','Heating'):lastMode==='dhw'?T('SWW','DHW'):lastMode==='cooling'?T('Koeling','Cooling'):null;
              var p3='<div style="background:'+C.sf2+';border:1.5px solid '+C.b2+';border-radius:14px;padding:18px;margin-bottom:8px;text-align:center;position:relative;overflow:hidden">';
              p3+='<div style="position:absolute;inset:0;opacity:0.15;background-image:radial-gradient('+C.mu+' 1px, transparent 1px);background-size:12px 12px;pointer-events:none"></div>';
              p3+='<div style="position:relative;display:inline-block;margin-bottom:10px">';
              p3+='<div class="dkRip" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:2px solid '+C.mu+'55;"></div>';
              p3+='<svg viewBox="0 0 64 64" style="width:64px;height:64px;display:block;position:relative">';
              p3+='<circle cx="32" cy="32" r="30" fill="'+C.mu+'10" stroke="'+C.mu+'44" stroke-width="1.5"/>';
              p3+='<text x="32" y="40" text-anchor="middle" font-size="26" fill="'+C.mu+'">⏸</text></svg></div>';
              p3+='<div style="position:relative"><div style="font-size:13px;font-weight:900;letter-spacing:1.3px;color:'+C.mu+';margin-bottom:3px">'+T('STANDBY','STANDBY')+'</div>';
              p3+='<div style="font-size:11.5px;font-weight:700;color:'+C.mu+';opacity:0.85;margin-bottom:10px">'+T('Compressor uit','Compressor off')+'</div>';
              if(lastNm){p3+='<div style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:'+C.ic+';padding:4px 12px;background:'+C.a+'14;border:1px solid '+C.a+'44;border-radius:6px">';
              p3+='<span>'+lastIc+'</span><span>'+T('Laatste: ','Last: ')+lastNm+'</span></div>';}
              p3+='</div></div>';
              r+=p3;
            }
            var p4='<div style="background:'+C.sf+';border:1px solid '+C.b+';border-radius:14px;padding:14px">';
            p4+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:12px;font-weight:900;letter-spacing:0.8px;color:'+C.tx+'">'+T('ENERGIE VANDAAG','ENERGY TODAY')+'</span>';
            p4+='<span style="font-size:11px;color:'+C.mu+';font-weight:700">'+T('totaal','total')+' <b style="color:'+gc(copT)+';font-family:ui-monospace,monospace;font-size:13px">COP '+f2(copT)+'</b></span></div>';
            p4+='<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:16px;padding:10px;background:'+C.sf2+';border-radius:10px">';
            p4+='<div style="text-align:center"><div style="font-size:9.5px;font-weight:800;color:'+C.mu+';letter-spacing:0.5px;margin-bottom:2px">⚡ '+T('ELEK','ELEC')+'</div>';
            p4+='<div class="dkN" style="font-size:15px;color:'+C.wn+'">'+f2(E.elT)+'</div></div>';
            p4+='<div style="display:flex;align-items:center;color:'+C.mu+'"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>';
            p4+='<div style="text-align:center"><div style="font-size:9.5px;font-weight:800;color:'+C.mu+';letter-spacing:0.5px;margin-bottom:2px">🌡 '+T('THERM','THERM')+'</div>';
            p4+='<div class="dkN" style="font-size:15px;color:'+C.a+'">'+f2(E.thT)+'</div></div></div>';
            if(E.thT > 0){
              var mixH = (E.thH / E.thT) * 100;
              var mixD = (E.thD / E.thT) * 100;
              var mixC = (E.thC / E.thT) * 100;
              p4+='<div style="font-size:9.5px;font-weight:800;color:'+C.mu+';margin-bottom:4px;letter-spacing:0.3px">'+T('VERDELING THERMISCH','THERMAL SPLIT')+'</div>';
              p4+='<div style="display:flex;height:12px;border-radius:6px;overflow:hidden;margin-bottom:12px;background:'+C.sf2+'">';
              if(mixH > 0) p4+='<div style="width:'+mixH+'%;background:'+C.bd+';border-right:1px solid '+C.sf+'" title="Heat"></div>';
              if(mixD > 0) p4+='<div style="width:'+mixD+'%;background:'+C.pu+';border-right:1px solid '+C.sf+'" title="DHW"></div>';
              if(mixC > 0) p4+='<div style="width:'+mixC+'%;background:#38BDF8" title="Cool"></div>';
              p4+='</div>';
            }
            p4+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
            var renderModeCard=function(icon,name,th,el,color){
              var cop = el > 0 ? th/el : 0;
              var cgc = cop > 0 ? gc(cop) : C.mu;
              var h='<div style="background:'+C.sf2+';border:1px solid '+C.b2+';border-radius:8px;padding:8px 10px">';
              h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">';
              h+='<div style="display:flex;align-items:center;gap:5px"><span style="font-size:11px">'+icon+'</span><span style="font-size:10.5px;font-weight:800;color:'+C.tx+'">'+name+'</span></div>';
              h+='<span style="font-size:10px;font-weight:900;color:'+cgc+'">COP '+f2(cop)+'</span></div>';
              h+='<div style="display:flex;justify-content:space-between;font-size:10px;font-weight:700;color:'+C.mu+'">';
              h+='<div><span style="color:'+color+';font-weight:900">'+f2(th)+'</span> kWh Th</div>';
              h+='<div><span style="color:'+C.wn+';font-weight:900">'+f2(el)+'</span> kWh El</div></div></div>';
              return h;
            };
            if(E.thH > 0 || E.elH > 0) p4+=renderModeCard('🔥', T('Verw','Heat'), E.thH, E.elH, C.bd);
            if(E.thD > 0 || E.elD > 0) p4+=renderModeCard('💧', T('SWW','DHW'), E.thD, E.elD, C.pu);
            if(E.thC > 0 || E.elC > 0) p4+=renderModeCard('❄️', T('Koel','Cool'), E.thC, E.elC, '#38BDF8');
            p4+='</div></div>';
            r+=p4;
            r+='</div>';
            return r;
          } catch (err) {
            return '<div style="padding:12px;color:#C62828;font-family:monospace;font-size:12px">⚠️ COP card error: ' + (err && err.message ? err.message : err) + '</div>';
          }
        ]]]
