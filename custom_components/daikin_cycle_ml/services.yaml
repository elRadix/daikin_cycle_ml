reset_counters:
  name: Reset counters
  description: Reset daily counters (all or a subset).
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    counters:
      name: Counters
      description: List of counter keys (leave empty for all).
      required: false
      selector:
        object:
  example:
    entry_id: "0123456789abcdef0123456789abcdef"

export_cycles:
  name: Export cycles
  description: Export cached cycles as JSON or CSV.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    days:
      name: Days
      description: Look-back window in days.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    format:
      name: Format
      description: Output format.
      required: false
      default: json
      selector:
        select:
          options:
            - json
            - csv
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    days: 30
    format: json

label_cycle:
  name: Label cycle
  description: Attach a user label to a stored cycle (ML training).
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    cycle_id:
      name: Cycle ID
      description: Database ID of the cycle.
      required: true
      selector:
        number:
          min: 1
          mode: box
    label:
      name: Label
      description: Label string.
      required: true
      selector:
        text:
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    cycle_id: 1
    label: good

recompute_baseline:
  name: Recompute baseline
  description: Recompute ML baseline (deferred to Batch 7).
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    days:
      name: Days
      description: Baseline window in days.
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    days: 7

run_maintenance:
  name: Run maintenance
  description: Aggregate and prune old cycles/alerts, optionally VACUUM.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    cycle_retention_days:
      name: Cycle retention (days)
      description: Delete cycles older than N days.
      required: false
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    alert_retention_days:
      name: Alert retention (days)
      description: Delete alerts older than N days.
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    vacuum:
      name: Vacuum
      description: Run SQLite VACUUM after prune.
      required: false
      selector:
        boolean:
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    cycle_retention_days: 90

send_test_notification:
  name: Send test notification
  description: Send a test message via the configured notify target.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID. Omit when only one Daikin entry is loaded.
      required: false
      selector:
        text:
    message:
      name: Message
      description: Optional custom message body.
      required: false
      selector:
        text:
    target:
      name: Target override
      description: Optional override of the configured notify target.
      required: false
      selector:
        text:
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    message: "Hello"

export_cop_hourly:
  name: Export COP hourly
  description: Export aggregated COP-per-hour rows as JSON or CSV.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    days:
      name: Days
      description: Look-back window in days.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box
    mode:
      name: Mode
      description: Optional filter (heating, dhw, defrost, unknown).
      required: false
      selector:
        text:
    format:
      name: Format
      description: Output format.
      required: false
      default: json
      selector:
        select:
          options:
            - json
            - csv
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    days: 30
    format: json

import_datasheet:
  name: Import datasheet
  description: Import or override user-supplied Daikin datasheet specs.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    payload:
      name: Payload
      description: Datasheet payload (dict or JSON string).
      required: true
      selector:
        object:
    source_url:
      name: Source URL
      description: Optional source reference for provenance.
      required: false
      selector:
        text:
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    payload:
      schema_version: 1
      models:
        epra04eav3:
          family: EPRA
          kw: 4.0
          lwt_min: 25.0
          lwt_max: 55.0
          nom_cop: 4.42
          refrigerant: R32
          gwp: 675
          charge_kg: 1.15
          points:
            - label: "A7/W35"
              t_out: 7.0
              t_lwc: 35.0
              cop: 4.42
    source_url: "installer-report-2026-10-04.pdf"

remove_user_datasheet:
  name: Remove user datasheet
  description: Remove a user-supplied datasheet override for a specific model.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text:
    model_key:
      name: Model key
      description: Model key to remove from user store.
      required: true
      selector:
        text:
  example:
    entry_id: "0123456789abcdef0123456789abcdef"
    model_key: "my_custom_hp"
