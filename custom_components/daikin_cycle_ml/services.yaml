reset_counters:
  name: Reset counters
  description: Reset daily counters (all or a subset).
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    counters:
      name: Counters
      description: List of counter keys (leave empty for all).
      required: false
      selector:
        object: null
export_cycles:
  name: Export cycles
  description: Export cached cycles as JSON or CSV.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    days:
      name: Days
      description: Look-back window in days.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    format:
      name: Format
      description: Output format.
      required: false
      default: json
      selector:
        select:
          options:
            - json
            - csv
label_cycle:
  name: Label cycle
  description: Attach a user label to a stored cycle (ML training).
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    cycle_id:
      name: Cycle ID
      description: Database ID of the cycle.
      required: true
      selector:
        number:
          min: 1
          mode: box
    label:
      name: Label
      description: Label string.
      required: true
      selector:
        text: null
recompute_baseline:
  name: Recompute baseline
  description: Recompute ML baseline (deferred to Batch 7).
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    days:
      name: Days
      description: Baseline window in days.
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 365
          mode: box
run_maintenance:
  name: Run maintenance
  description: Aggregate and prune old cycles/alerts, optionally VACUUM.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    cycle_retention_days:
      name: Cycle retention (days)
      description: Delete cycles older than N days.
      required: false
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    alert_retention_days:
      name: Alert retention (days)
      description: Delete alerts older than N days.
      required: false
      selector:
        number:
          min: 1
          max: 365
          mode: box
    vacuum:
      name: Vacuum
      description: Run SQLite VACUUM after prune.
      required: false
      selector:
        boolean: null
send_test_notification:
  name: Send test notification
  description: Send a test message via the configured notify target.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID. Omit when only one Daikin entry is loaded.
      required: false
      selector:
        text: null
    message:
      name: Message
      description: Optional custom message body.
      required: false
      selector:
        text: null
    target:
      name: Target override
      description: Optional override of the configured notify target.
      required: false
      selector:
        text: null
export_cop_hourly:
  name: Export COP hourly
  description: Export aggregated COP-per-hour rows as JSON or CSV.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    days:
      name: Days
      description: Look-back window in days.
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 365
          mode: box
    mode:
      name: Mode
      description: Optional filter (heating, dhw, defrost, unknown).
      required: false
      selector:
        text: null
    format:
      name: Format
      description: Output format.
      required: false
      default: json
      selector:
        select:
          options:
            - json
            - csv
import_datasheet:
  name: Import datasheet
  description: Import or override user-supplied Daikin datasheet specs.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    payload:
      name: Payload
      description: Datasheet payload (dict or JSON string).
      required: true
      selector:
        object: null
    source_url:
      name: Source URL
      description: Optional source reference for provenance.
      required: false
      selector:
        text: null
remove_user_datasheet:
  name: Remove user datasheet
  description: Remove a user-supplied datasheet override for a specific model.
  fields:
    entry_id:
      name: Config entry
      description: Config entry ID.
      required: true
      selector:
        text: null
    model_key:
      name: Model key
      description: Model key to remove from user store.
      required: true
      selector:
        text: null
